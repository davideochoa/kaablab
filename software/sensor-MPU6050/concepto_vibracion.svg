<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, Arial, sans-serif">
  <title>Concepto: vibración estructural medida por el MPU6050</title>
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    ¿Qué mide el MPU6050? Vibración estructural
  </text>
  <text x="380" y="46" text-anchor="middle" font-size="12" fill="#555555">
    Movimiento mecánico transmitido por la madera de la colmena — no sonido aéreo
  </text>

  <!-- ===== Ilustración conceptual: corte de pared con forrajera señalizando por sustrato ===== -->
  <rect x="70" y="80" width="46" height="180" fill="#caa472" stroke="#7a5a30" stroke-width="2"/>
  <text x="93" y="275" text-anchor="middle" font-size="11" fill="#7a5a30">Pared de</text>
  <text x="93" y="288" text-anchor="middle" font-size="11" fill="#7a5a30">madera</text>

  <!-- cavidad interior -->
  <rect x="116" y="80" width="220" height="180" fill="#fbf6ea" stroke="#c9a227" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="226" y="96" text-anchor="middle" font-size="11" fill="#8a6d00">Interior de la colmena</text>

  <!-- forrajera dentro, contra la pared -->
  <circle cx="140" cy="170" r="10" fill="#f5c518" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="176" y="210" text-anchor="middle" font-size="10" fill="#555555">Forrajera señalizando</text>
  <text x="176" y="223" text-anchor="middle" font-size="10" fill="#555555">por vibración de sustrato</text>

  <!-- ondas de vibración mecánica dentro de la madera, hacia el exterior -->
  <path d="M116 140 q10 8 0 16 q-10 8 0 16" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M100 140 q10 8 0 16 q-10 8 0 16" fill="none" stroke="#c0392b" stroke-width="2" opacity="0.7"/>
  <path d="M84 140 q10 8 0 16 q-10 8 0 16" fill="none" stroke="#c0392b" stroke-width="1.5" opacity="0.5"/>
  <text x="93" y="120" text-anchor="middle" font-size="10" fill="#c0392b">vibración</text>
  <text x="93" y="132" text-anchor="middle" font-size="10" fill="#c0392b">por la madera</text>

  <!-- sensor MPU6050 en contacto directo con la madera, lado exterior -->
  <rect x="46" y="148" width="42" height="36" rx="4" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="67" y="169" text-anchor="middle" font-size="9.5" fill="#1a1a1a">MPU</text>
  <text x="67" y="180" text-anchor="middle" font-size="9.5" fill="#1a1a1a">6050</text>
  <text x="67" y="200" text-anchor="middle" font-size="10" fill="#227a3d">contacto directo</text>
  <text x="67" y="212" text-anchor="middle" font-size="10" fill="#227a3d">con la madera</text>

  <!-- ===== Gráfica de rango de frecuencia ===== -->
  <text x="450" y="105" font-size="13" font-weight="bold" fill="#1a1a1a">Rango de frecuencia objetivo</text>

  <!-- eje -->
  <line x1="380" y1="330" x2="700" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- marcas 0,200,400,600,800,1000,1200 Hz -->
  <g font-size="10" fill="#555555">
    <line x1="380" y1="325" x2="380" y2="335" stroke="#1a1a1a"/>
    <text x="380" y="348" text-anchor="middle">0</text>
    <line x1="433" y1="325" x2="433" y2="335" stroke="#1a1a1a"/>
    <text x="433" y="348" text-anchor="middle">200</text>
    <line x1="486" y1="325" x2="486" y2="335" stroke="#1a1a1a"/>
    <text x="486" y="348" text-anchor="middle">400</text>
    <line x1="540" y1="325" x2="540" y2="335" stroke="#1a1a1a"/>
    <text x="540" y="348" text-anchor="middle">600</text>
    <line x1="593" y1="325" x2="593" y2="335" stroke="#1a1a1a"/>
    <text x="593" y="348" text-anchor="middle">800</text>
    <line x1="646" y1="325" x2="646" y2="335" stroke="#1a1a1a"/>
    <text x="646" y="348" text-anchor="middle">1000</text>
    <line x1="700" y1="325" x2="700" y2="335" stroke="#1a1a1a"/>
    <text x="700" y="348" text-anchor="middle">1200 Hz</text>
  </g>

  <!-- banda objetivo 300-600 Hz -->
  <rect x="460" y="150" width="80" height="170" fill="#f6d2c9" opacity="0.6"/>
  <rect x="460" y="150" width="80" height="14" fill="#c0392b"/>
  <text x="500" y="140" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Banda objetivo</text>
  <text x="500" y="212" text-anchor="middle" font-size="11" fill="#8a3226" transform="rotate(0)">300–600 Hz</text>
  <text x="500" y="226" text-anchor="middle" font-size="9.5" fill="#8a3226">(forrajeo/comunicación,</text>
  <text x="500" y="238" text-anchor="middle" font-size="9.5" fill="#8a3226">Hrncir et al. 2006)</text>

  <!-- limite Nyquist real ~500 Hz -->
  <line x1="486" y1="150" x2="486" y2="330" stroke="#8a6d00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="486" y="270" text-anchor="middle" font-size="10" fill="#8a6d00" transform="rotate(-90 486 270)">Nyquist real del acelerómetro ≈ 500 Hz</text>

  <!-- caja de nota -->
  <rect x="380" y="365" width="320" height="80" rx="6" fill="#fff8e6" stroke="#8a6d00" stroke-width="1"/>
  <text x="392" y="382" font-size="10.5" fill="#1a1a1a">El ADC del acelerómetro muestrea internamente</text>
  <text x="392" y="396" font-size="10.5" fill="#1a1a1a">a 1 kHz fijo (ver README §2.2): el Nyquist real</text>
  <text x="392" y="410" font-size="10.5" fill="#1a1a1a">queda en ~500 Hz, al límite del extremo superior</text>
  <text x="392" y="424" font-size="10.5" fill="#1a1a1a">de la banda — sin margen. Confirmar en banco.</text>

  <!-- Leyenda -->
  <rect x="70" y="430" width="14" height="14" fill="#c0392b" opacity="0.6"/>
  <text x="90" y="441" font-size="10.5" fill="#1a1a1a">Banda objetivo (300–600 Hz)</text>

  <line x1="230" y1="437" x2="250" y2="437" stroke="#8a6d00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="256" y="441" font-size="10.5" fill="#1a1a1a">Límite Nyquist real (≈500 Hz)</text>
</svg>
