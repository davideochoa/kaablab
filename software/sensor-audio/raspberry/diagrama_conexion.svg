<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión Raspberry Pi 4 Model B — INMP441</title>
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión Raspberry Pi 4 Model B ↔ INMP441
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — audio I²S, nivel acústico / vitalidad de la colonia (16 kHz, mono) · equivalente a arduino/diagrama_conexion.svg
  </text>

  <!-- Raspberry Pi 4 box -->
  <rect x="60" y="90" width="200" height="320" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Raspberry Pi 4</text>
  <text x="160" y="135" text-anchor="middle" font-size="11" fill="#555555">Model B (2GB, mínimo recomendado)</text>

  <!-- Raspberry Pi pins -->
  <circle cx="252" cy="170" r="4" fill="#2c5aa0"/>
  <text x="150" y="175" text-anchor="end" font-size="13" fill="#1a1a1a">3V3 (pin 1)</text>

  <circle cx="252" cy="210" r="4" fill="#2c5aa0"/>
  <text x="150" y="215" text-anchor="end" font-size="13" fill="#1a1a1a">GND (pin 9)</text>

  <circle cx="252" cy="250" r="4" fill="#7a2ca0"/>
  <text x="150" y="255" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO18 (pin 12) — BCLK</text>

  <circle cx="252" cy="290" r="4" fill="#7a2ca0"/>
  <text x="150" y="295" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO19 (pin 35) — LRCLK</text>

  <circle cx="252" cy="330" r="4" fill="#7a2ca0"/>
  <text x="150" y="335" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO20 (pin 38) — DIN</text>

  <circle cx="252" cy="370" r="4" fill="#555555"/>
  <text x="150" y="375" text-anchor="end" font-size="13" fill="#1a1a1a">GND (2)</text>
  <text x="150" y="390" text-anchor="end" font-size="10" fill="#555555">para L/R -&gt; canal mono</text>

  <!-- INMP441 box -->
  <rect x="500" y="110" width="200" height="270" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">INMP441</text>
  <text x="600" y="155" text-anchor="middle" font-size="11" fill="#555555">micrófono MEMS I²S</text>

  <circle cx="508" cy="190" r="4" fill="#227a3d"/>
  <text x="525" y="195" font-size="13" fill="#1a1a1a">VDD (3.3V)</text>

  <circle cx="508" cy="225" r="4" fill="#227a3d"/>
  <text x="525" y="230" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="508" cy="260" r="4" fill="#7a2ca0"/>
  <text x="525" y="265" font-size="13" fill="#1a1a1a">SCK</text>

  <circle cx="508" cy="295" r="4" fill="#7a2ca0"/>
  <text x="525" y="300" font-size="13" fill="#1a1a1a">WS</text>

  <circle cx="508" cy="330" r="4" fill="#7a2ca0"/>
  <text x="525" y="335" font-size="13" fill="#1a1a1a">SD</text>

  <circle cx="508" cy="360" r="4" fill="#555555"/>
  <text x="525" y="365" font-size="13" fill="#1a1a1a">L/R</text>

  <!-- Connections -->
  <!-- VDD -->
  <line x1="252" y1="170" x2="508" y2="190" stroke="#227a3d" stroke-width="2"/>
  <text x="380" y="178" text-anchor="middle" font-size="11" fill="#227a3d">3V3 → VDD</text>

  <!-- GND -->
  <line x1="252" y1="210" x2="508" y2="225" stroke="#555555" stroke-width="2"/>
  <text x="380" y="213" text-anchor="middle" font-size="11" fill="#555555">GND → GND</text>

  <!-- BCLK -->
  <line x1="252" y1="250" x2="508" y2="260" stroke="#7a2ca0" stroke-width="2"/>
  <text x="380" y="252" text-anchor="middle" font-size="11" fill="#7a2ca0">GPIO18 → SCK (BCLK)</text>

  <!-- LRCLK -->
  <line x1="252" y1="290" x2="508" y2="295" stroke="#7a2ca0" stroke-width="2"/>
  <text x="380" y="288" text-anchor="middle" font-size="11" fill="#7a2ca0">GPIO19 → WS (LRCLK)</text>

  <!-- DIN -->
  <line x1="252" y1="330" x2="508" y2="330" stroke="#7a2ca0" stroke-width="2"/>
  <text x="380" y="323" text-anchor="middle" font-size="11" fill="#7a2ca0">GPIO20 → SD (DIN)</text>

  <!-- L/R to GND -->
  <line x1="252" y1="370" x2="508" y2="360" stroke="#555555" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="380" y="362" text-anchor="middle" font-size="11" fill="#555555">GND → L/R (canal izquierdo, mono)</text>

  <!-- Legend -->
  <rect x="60" y="425" width="14" height="14" fill="#227a3d"/>
  <text x="80" y="436" font-size="11" fill="#1a1a1a">Alimentación</text>

  <rect x="200" y="425" width="14" height="14" fill="#7a2ca0"/>
  <text x="220" y="436" font-size="11" fill="#1a1a1a">Bus I²S por hardware (BCLK/LRCLK/DIN)</text>

  <rect x="470" y="425" width="14" height="14" fill="#555555"/>
  <text x="490" y="436" font-size="11" fill="#1a1a1a">GND / selección de canal (L/R)</text>

  <text x="380" y="460" text-anchor="middle" font-size="10" fill="#777777">
    L/R a GND selecciona el canal izquierdo del INMP441 (mono). Requiere dtparam=i2s=on y overlay de tarjeta de sonido I²S — ver raspberry/captura_inmp441.py.
  </text>
</svg>
