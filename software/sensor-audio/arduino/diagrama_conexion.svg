<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 765" width="760" height="765" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión ESP32 DevKit V1 — INMP441</title>
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión ESP32 DevKit V1 ↔ INMP441
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — audio I²S, nivel acústico / vitalidad de la colonia (16 kHz, mono)
  </text>

  <!-- ESP32 DevKit V1 box -->
  <rect x="60" y="90" width="200" height="320" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">ESP32 DevKit V1</text>

  <!-- ESP32 pins -->
  <circle cx="252" cy="160" r="4" fill="#2c5aa0"/>
  <text x="150" y="165" text-anchor="end" font-size="13" fill="#1a1a1a">3V3</text>

  <circle cx="252" cy="200" r="4" fill="#2c5aa0"/>
  <text x="150" y="205" text-anchor="end" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="252" cy="240" r="4" fill="#7a2ca0"/>
  <text x="150" y="245" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO14 (SCK)</text>

  <circle cx="252" cy="280" r="4" fill="#7a2ca0"/>
  <text x="150" y="285" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO15 (WS)</text>

  <circle cx="252" cy="320" r="4" fill="#7a2ca0"/>
  <text x="150" y="325" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO32 (SD)</text>

  <circle cx="252" cy="360" r="4" fill="#555555"/>
  <text x="150" y="365" text-anchor="end" font-size="13" fill="#1a1a1a">GND (2)</text>
  <text x="150" y="380" text-anchor="end" font-size="10" fill="#555555">para L/R -&gt; canal mono</text>

  <!-- INMP441 box -->
  <rect x="500" y="110" width="200" height="270" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">INMP441</text>
  <text x="600" y="155" text-anchor="middle" font-size="11" fill="#555555">micrófono MEMS I²S</text>

  <circle cx="508" cy="190" r="4" fill="#227a3d"/>
  <text x="525" y="195" font-size="13" fill="#1a1a1a">VDD (3.3V)</text>

  <circle cx="508" cy="225" r="4" fill="#227a3d"/>
  <text x="525" y="230" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="508" cy="260" r="4" fill="#7a2ca0"/>
  <text x="525" y="265" font-size="13" fill="#1a1a1a">SCK</text>

  <circle cx="508" cy="295" r="4" fill="#7a2ca0"/>
  <text x="525" y="300" font-size="13" fill="#1a1a1a">WS</text>

  <circle cx="508" cy="330" r="4" fill="#7a2ca0"/>
  <text x="525" y="335" font-size="13" fill="#1a1a1a">SD</text>

  <circle cx="508" cy="360" r="4" fill="#555555"/>
  <text x="525" y="365" font-size="13" fill="#1a1a1a">L/R</text>

  <!-- Connections -->
  <!-- VDD -->
  <line x1="252" y1="160" x2="508" y2="190" stroke="#227a3d" stroke-width="2"/>
  <text x="380" y="168" text-anchor="middle" font-size="11" fill="#227a3d">3V3 → VDD</text>

  <!-- GND -->
  <line x1="252" y1="200" x2="508" y2="225" stroke="#555555" stroke-width="2"/>
  <text x="380" y="205" text-anchor="middle" font-size="11" fill="#555555">GND → GND</text>

  <!-- SCK -->
  <line x1="252" y1="240" x2="508" y2="260" stroke="#7a2ca0" stroke-width="2"/>
  <text x="380" y="243" text-anchor="middle" font-size="11" fill="#7a2ca0">GPIO14 → SCK</text>

  <!-- WS -->
  <line x1="252" y1="280" x2="508" y2="295" stroke="#7a2ca0" stroke-width="2"/>
  <text x="380" y="281" text-anchor="middle" font-size="11" fill="#7a2ca0">GPIO15 → WS</text>

  <!-- SD -->
  <line x1="252" y1="320" x2="508" y2="330" stroke="#7a2ca0" stroke-width="2"/>
  <text x="380" y="319" text-anchor="middle" font-size="11" fill="#7a2ca0">GPIO32 → SD</text>

  <!-- L/R to GND -->
  <line x1="252" y1="360" x2="508" y2="360" stroke="#555555" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="380" y="352" text-anchor="middle" font-size="11" fill="#555555">GND → L/R (canal izquierdo, mono)</text>

  <!-- Legend -->
  <rect x="60" y="425" width="14" height="14" fill="#227a3d"/>
  <text x="80" y="436" font-size="11" fill="#1a1a1a">Alimentación</text>

  <rect x="200" y="425" width="14" height="14" fill="#7a2ca0"/>
  <text x="220" y="436" font-size="11" fill="#1a1a1a">Bus I²S (SCK/WS/SD)</text>

  <rect x="430" y="425" width="14" height="14" fill="#555555"/>
  <text x="450" y="436" font-size="11" fill="#1a1a1a">GND / selección de canal (L/R)</text>

  <text x="380" y="460" text-anchor="middle" font-size="10" fill="#777777">
    L/R a GND selecciona el canal izquierdo del INMP441 (mono) — suficiente para una señal de audio por colmena.
  </text>


  <!-- ===== Componentes pasivos (generado; ver README.md del sensor, tabla de pasivos) ===== -->
  <g id="componentes-pasivos" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="480" width="760" height="285" fill="#ffffff"/>
  <rect x="16" y="486" width="728" height="273" rx="6" fill="#fafafa" stroke="#cccccc"/>
  <text x="30" y="506" font-size="13" font-weight="bold" fill="#1a1a1a">Componentes pasivos</text>
  <line x1="190" y1="502" x2="212" y2="502" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="218" y="506" font-size="10.5" fill="#1a1a1a">externo a añadir</text>
  <line x1="340" y1="502" x2="362" y2="502" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
  <text x="368" y="506" font-size="10.5" fill="#1a1a1a">externo opcional</text>
  <line x1="490" y1="502" x2="512" y2="502" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="518" y="506" font-size="10.5" fill="#1a1a1a">ya en el módulo / placa</text>
  <text x="30" y="524" font-size="9.5" fill="#555555">Estado del valor: <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></text>
  <line x1="30" y1="543" x2="40" y2="543" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="536" x2="40" y2="550" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="536" x2="45" y2="550" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="543" x2="55" y2="543" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="542" font-size="11" font-weight="bold" fill="#1a1a1a">100 µF electrolítico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="556" font-size="9.5" fill="#444444">Entre 3V3 y GND de la ESP32, junto a la placa — valor de diseño, no tomado de hoja de datos</text>
  <line x1="30" y1="576" x2="40" y2="576" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="569" x2="40" y2="583" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="569" x2="45" y2="583" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="576" x2="55" y2="576" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="575" font-size="11" font-weight="bold" fill="#1a1a1a">100 nF cerámico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="589" font-size="9.5" fill="#444444">Entre 3V3 y GND de la ESP32, en paralelo con el de 100 µF — valor de diseño</text>
  <line x1="30" y1="609" x2="38" y2="609" stroke="#c0392b" stroke-width="2" fill="none"/><polygon points="38,603 38,615 47,609" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="47" y1="603" x2="47" y2="615" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="47" y1="609" x2="55" y2="609" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="608" font-size="11" font-weight="bold" fill="#1a1a1a">1N4007 en serie (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="622" font-size="9.5" fill="#444444">Solo en la entrada externa de 6.5–16 V hacia VIN; NO en el riel de 5 V/USB. Caída ≈ 1.1 V a 1 A (hoja 1N4007). Tope del regulador de la</text>
  <text x="66" y="635" font-size="9.5" fill="#444444">placa no confirmado</text>
  <line x1="30" y1="655" x2="40" y2="655" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="648" x2="40" y2="662" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="648" x2="45" y2="662" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="655" x2="55" y2="655" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="654" font-size="11" font-weight="bold" fill="#1a1a1a">100 nF cerámico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#c0392b">● pendiente de verificar</tspan>  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="668" font-size="9.5" fill="#444444">Entre VDD y GND, junto al pin VDD (0.1 µF en hojas ADMP441/INMP621; confirmar en hoja INMP441)</text>
  <line x1="30" y1="688" x2="40" y2="688" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/><line x1="40" y1="681" x2="40" y2="695" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/><line x1="45" y1="681" x2="45" y2="695" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/><line x1="45" y1="688" x2="55" y2="688" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
  <text x="66" y="687" font-size="11" font-weight="bold" fill="#1a1a1a">10 µF (×1, opcional)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="701" font-size="9.5" fill="#444444">Entre VDD y GND, en paralelo con el de 100 nF, si la alimentación es ruidosa</text>
  <circle cx="42" cy="721" r="7" stroke="#c0392b" stroke-width="2" fill="none"/><text x="42" y="725" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="720" font-size="11" font-weight="bold" fill="#1a1a1a">L/R a GND<tspan font-weight="normal" font-size="9.5">  <tspan fill="#227a3d">● hoja de datos</tspan></tspan></text>
  <text x="66" y="734" font-size="9.5" fill="#444444">Selecciona el canal izquierdo de la trama I²S (canal mono del firmware)</text>
  </g>
</svg>
