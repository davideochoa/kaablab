<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, Arial, sans-serif">
  <title>Concepto: nivel acústico (sonido aéreo) captado por el INMP441</title>
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    ¿Qué mide el INMP441? Nivel acústico (sonido aéreo)
  </text>
  <text x="380" y="46" text-anchor="middle" font-size="12" fill="#555555">
    Presión sonora que viaja por el aire dentro de la piquera y la cavidad — no vibración de sustrato
  </text>

  <!-- ===== Ilustración conceptual: túnel de la piquera con abeja y mic ===== -->
  <rect x="90" y="70" width="560" height="70" fill="#caa472" stroke="#7a5a30" stroke-width="2"/>
  <rect x="90" y="90" width="560" height="30" fill="#fdf8ef" stroke="#7a5a30" stroke-width="1"/>
  <text x="370" y="63" text-anchor="middle" font-size="11" fill="#7a5a30">Túnel de la piquera (madera)</text>

  <!-- abeja en transito dentro del tunel -->
  <circle cx="190" cy="105" r="8" fill="#f5c518" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="190" y="135" text-anchor="middle" font-size="10" fill="#555555">Forrajera en tránsito</text>
  <text x="190" y="148" text-anchor="middle" font-size="10" fill="#555555">(zumbido de vuelo)</text>

  <!-- ondas de presion sonora, aereas, propagandose por el tunel -->
  <path d="M202 105 q10 -12 20 0" fill="none" stroke="#2c5aa0" stroke-width="1.6"/>
  <path d="M202 105 q16 -19 32 0" fill="none" stroke="#2c5aa0" stroke-width="1.6" opacity="0.75"/>
  <path d="M202 105 q22 -26 44 0" fill="none" stroke="#2c5aa0" stroke-width="1.6" opacity="0.55"/>
  <path d="M202 105 q28 -33 56 0" fill="none" stroke="#2c5aa0" stroke-width="1.6" opacity="0.35"/>
  <text x="270" y="60" text-anchor="middle" font-size="10" fill="#2c5aa0">presión sonora por el aire</text>

  <!-- microfono al extremo interior del tunel -->
  <rect x="560" y="80" width="60" height="40" rx="6" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="590" y="104" text-anchor="middle" font-size="10" fill="#1a1a1a">INMP441</text>
  <text x="590" y="152" text-anchor="middle" font-size="10" fill="#8a6d00">Interior de la colmena</text>

  <!-- ===== Gráfica de rango de frecuencia (escala lineal 0-16 kHz) ===== -->
  <text x="380" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">
    Rango de respuesta y bandas de interés (escala lineal, 0–16 kHz)
  </text>

  <!-- eje -->
  <line x1="80" y1="400" x2="700" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>
  <g font-size="10" fill="#555555">
    <line x1="80" y1="395" x2="80" y2="405" stroke="#1a1a1a"/><text x="80" y="418" text-anchor="middle">0</text>
    <line x1="235" y1="395" x2="235" y2="405" stroke="#1a1a1a"/><text x="235" y="418" text-anchor="middle">4k</text>
    <line x1="390" y1="395" x2="390" y2="405" stroke="#1a1a1a"/><text x="390" y="418" text-anchor="middle">8k</text>
    <line x1="545" y1="395" x2="545" y2="405" stroke="#1a1a1a"/><text x="545" y="418" text-anchor="middle">12k</text>
    <line x1="700" y1="395" x2="700" y2="405" stroke="#1a1a1a"/><text x="700" y="418" text-anchor="middle">16k Hz</text>
  </g>
  <!-- escala: x = 80 + f * 0.03875 -->

  <!-- fila 1: rango del sensor 60-15000 Hz -->
  <rect x="82" y="205" width="639" height="18" fill="#dbe7f5" stroke="#2c5aa0" stroke-width="1"/>
  <text x="60" y="218" text-anchor="end" font-size="10.5" fill="#1a1a1a">Sensor (plano)</text>
  <text x="82" y="200" font-size="9.5" fill="#2c5aa0">60 Hz – 15 kHz (Suárez Carvajal, 2025)</text>

  <!-- fila 2: comunicacion acustica 200-2000 -->
  <rect x="88" y="245" width="70" height="18" fill="#d9f2df" stroke="#227a3d" stroke-width="1"/>
  <text x="60" y="258" text-anchor="end" font-size="10.5" fill="#1a1a1a">Comunicación</text>
  <text x="88" y="240" font-size="9.5" fill="#227a3d">200–2,000 Hz (rango óptimo)</text>

  <!-- fila 3: vuelo en piquera 200-500 -->
  <rect x="88" y="285" width="16" height="18" fill="#e9def5" stroke="#7a2ca0" stroke-width="1"/>
  <text x="60" y="298" text-anchor="end" font-size="10.5" fill="#1a1a1a">Vuelo en piquera</text>
  <text x="108" y="298" font-size="9.5" fill="#7a2ca0">200–500 Hz</text>

  <!-- fila 4: alarma 5000-8000 -->
  <rect x="274" y="325" width="116" height="18" fill="#fbe8bf" stroke="#8a6d00" stroke-width="1"/>
  <text x="60" y="338" text-anchor="end" font-size="10.5" fill="#1a1a1a">Alarma/intrusos</text>
  <text x="274" y="320" font-size="9.5" fill="#8a6d00">hasta 5,000–8,000 Hz</text>

  <!-- caja de nota -->
  <rect x="440" y="255" width="260" height="95" rx="6" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1"/>
  <text x="452" y="273" font-size="10.5" fill="#1a1a1a">Fuera de alcance del INMP441:</text>
  <text x="452" y="287" font-size="10.5" fill="#1a1a1a">vibración estructural 1–50 Hz</text>
  <text x="452" y="301" font-size="10.5" fill="#1a1a1a">(comportamiento defensivo por</text>
  <text x="452" y="315" font-size="10.5" fill="#1a1a1a">sustrato) — capturada por el</text>
  <text x="452" y="329" font-size="10.5" fill="#1a1a1a">MPU6050, ver ../sensor-vibracion/</text>
</svg>
