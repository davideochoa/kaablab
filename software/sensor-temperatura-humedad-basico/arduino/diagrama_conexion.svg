<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" width="760" height="672" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión ESP32 DevKit V1 — DHT22</title>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión ESP32 DevKit V1 ↔ DHT22 (temperatura/HR externa)
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — sensor externo secundario, protocolo digital propietario de un solo hilo
  </text>

  <!-- ESP32 DevKit V1 box -->
  <rect x="60" y="100" width="200" height="220" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">ESP32 DevKit V1</text>

  <circle cx="252" cy="170" r="4" fill="#2c5aa0"/>
  <text x="150" y="175" text-anchor="end" font-size="13" fill="#1a1a1a">3V3</text>

  <circle cx="252" cy="210" r="4" fill="#2c5aa0"/>
  <text x="150" y="215" text-anchor="end" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="252" cy="250" r="4" fill="#2c5aa0"/>
  <text x="150" y="255" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO4 (DATA)</text>

  <!-- DHT22 box -->
  <rect x="500" y="120" width="200" height="180" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="600" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">DHT22 / AM2302</text>

  <circle cx="508" cy="190" r="4" fill="#227a3d"/>
  <text x="525" y="195" font-size="13" fill="#1a1a1a">VCC (3.3 V)</text>

  <circle cx="508" cy="230" r="4" fill="#227a3d"/>
  <text x="525" y="235" font-size="13" fill="#1a1a1a">DATA</text>

  <circle cx="508" cy="270" r="4" fill="#227a3d"/>
  <text x="525" y="275" font-size="13" fill="#1a1a1a">GND</text>

  <!-- Resistencia pull-up -->
  <rect x="330" y="215" width="60" height="16" fill="#fff3cd" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="360" y="227" text-anchor="middle" font-size="9.5" fill="#8a6d00">10 kΩ</text>
  <text x="360" y="205" text-anchor="middle" font-size="10" fill="#8a6d00">pull-up (si el módulo no la trae)</text>

  <!-- Connections -->
  <!-- VCC -->
  <line x1="252" y1="170" x2="508" y2="190" stroke="#227a3d" stroke-width="2"/>
  <text x="380" y="175" text-anchor="middle" font-size="11" fill="#227a3d">3V3 → VCC</text>

  <!-- DATA con pull-up hacia VCC -->
  <line x1="252" y1="250" x2="508" y2="230" stroke="#c0392b" stroke-width="2"/>
  <text x="380" y="260" text-anchor="middle" font-size="11" fill="#c0392b">GPIO4 → DATA</text>
  <line x1="360" y1="215" x2="360" y2="180" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="360" y1="180" x2="252" y2="170" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- GND -->
  <line x1="252" y1="210" x2="508" y2="270" stroke="#555555" stroke-width="2"/>
  <text x="380" y="255" text-anchor="middle" font-size="11" fill="#555555" transform="translate(0,20)">GND → GND</text>

  <!-- Legend -->
  <rect x="60" y="345" width="14" height="14" fill="#227a3d"/>
  <text x="80" y="356" font-size="11" fill="#1a1a1a">Alimentación</text>

  <rect x="200" y="345" width="14" height="14" fill="#c0392b"/>
  <text x="220" y="356" font-size="11" fill="#1a1a1a">Señal DATA (protocolo propietario, un solo hilo)</text>

  <rect x="490" y="345" width="14" height="14" fill="#8a6d00" opacity="0.6"/>
  <text x="510" y="356" font-size="11" fill="#1a1a1a">Pull-up 10 kΩ (DATA a VCC = 3.3 V)</text>

  <text x="380" y="390" text-anchor="middle" font-size="10" fill="#777777">
    Muchos módulos AM2302/DHT22 ya incluyen la resistencia pull-up integrada en la placa — verificar antes de añadir una externa.
  </text>


    <text x="380" y="408" text-anchor="middle" font-size="10" fill="#c0392b">Alimentar a 3.3 V (pull-up de DATA a 3.3 V); verificar en la hoja de datos el alcance de cable con 3.3 V.</text>

  <!-- ===== Componentes pasivos (generado; ver README.md del sensor, tabla de pasivos) ===== -->
  <g id="componentes-pasivos" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="420" width="760" height="252" fill="#ffffff"/>
  <rect x="16" y="426" width="728" height="240" rx="6" fill="#fafafa" stroke="#cccccc"/>
  <text x="30" y="446" font-size="13" font-weight="bold" fill="#1a1a1a">Componentes pasivos</text>
  <line x1="190" y1="442" x2="212" y2="442" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="218" y="446" font-size="10.5" fill="#1a1a1a">externo a añadir</text>
  <line x1="340" y1="442" x2="362" y2="442" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
  <text x="368" y="446" font-size="10.5" fill="#1a1a1a">externo opcional</text>
  <line x1="490" y1="442" x2="512" y2="442" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="518" y="446" font-size="10.5" fill="#1a1a1a">ya en el módulo / placa</text>
  <text x="30" y="464" font-size="9.5" fill="#555555">Estado del valor: <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></text>
  <line x1="30" y1="483" x2="40" y2="483" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="476" x2="40" y2="490" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="476" x2="45" y2="490" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="483" x2="55" y2="483" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="482" font-size="11" font-weight="bold" fill="#1a1a1a">100 µF electrolítico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="496" font-size="9.5" fill="#444444">Entre 3V3 y GND de la ESP32, junto a la placa — valor de diseño, no tomado de hoja de datos</text>
  <line x1="30" y1="516" x2="40" y2="516" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="509" x2="40" y2="523" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="509" x2="45" y2="523" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="516" x2="55" y2="516" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="515" font-size="11" font-weight="bold" fill="#1a1a1a">100 nF cerámico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="529" font-size="9.5" fill="#444444">Entre 3V3 y GND de la ESP32, en paralelo con el de 100 µF — valor de diseño</text>
  <line x1="30" y1="549" x2="38" y2="549" stroke="#c0392b" stroke-width="2" fill="none"/><polygon points="38,543 38,555 47,549" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="47" y1="543" x2="47" y2="555" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="47" y1="549" x2="55" y2="549" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="548" font-size="11" font-weight="bold" fill="#1a1a1a">1N4007 en serie (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="562" font-size="9.5" fill="#444444">Solo en la entrada externa de 6.5–16 V hacia VIN; NO en el riel de 5 V/USB. Caída ≈ 1.1 V a 1 A (hoja 1N4007). Tope del regulador de la</text>
  <text x="66" y="575" font-size="9.5" fill="#444444">placa no confirmado</text>
  <line x1="30" y1="595" x2="35" y2="595" stroke="#c0392b" stroke-width="2" fill="none"/><rect x="35" y="590" width="15" height="10" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="50" y1="595" x2="55" y2="595" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="594" font-size="11" font-weight="bold" fill="#1a1a1a">Pull-up 4.7–10 kΩ (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="608" font-size="9.5" fill="#444444">Entre DATA y VCC; omitir si el módulo de 3 pines ya la trae</text>
  <line x1="30" y1="628" x2="40" y2="628" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="621" x2="40" y2="635" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="621" x2="45" y2="635" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="628" x2="55" y2="628" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="627" font-size="11" font-weight="bold" fill="#1a1a1a">100 nF cerámico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#227a3d">● hoja de datos</tspan></tspan></text>
  <text x="66" y="641" font-size="9.5" fill="#444444">Entre VCC y GND, junto al sensor (hoja AM2302: filtrado)</text>
  </g>
</svg>
