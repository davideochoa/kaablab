<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 593" width="760" height="593" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión Raspberry Pi 4 Model B — DHT22</title>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión Raspberry Pi 4 Model B ↔ DHT22 (temperatura/HR externa)
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — sensor externo secundario · equivalente a arduino/diagrama_conexion.svg
  </text>

  <!-- Raspberry Pi 4 box -->
  <rect x="60" y="100" width="200" height="220" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Raspberry Pi 4</text>
  <text x="160" y="145" text-anchor="middle" font-size="11" fill="#555555">Model B (2GB, mínimo recomendado)</text>

  <circle cx="252" cy="185" r="4" fill="#2c5aa0"/>
  <text x="150" y="190" text-anchor="end" font-size="13" fill="#1a1a1a">3V3 (pin 1)</text>

  <circle cx="252" cy="225" r="4" fill="#2c5aa0"/>
  <text x="150" y="230" text-anchor="end" font-size="13" fill="#1a1a1a">GND (pin 6)</text>

  <circle cx="252" cy="265" r="4" fill="#2c5aa0"/>
  <text x="150" y="270" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO4 (pin 7, DATA)</text>

  <!-- DHT22 box -->
  <rect x="500" y="120" width="200" height="180" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="600" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">DHT22 / AM2302</text>

  <circle cx="508" cy="190" r="4" fill="#227a3d"/>
  <text x="525" y="195" font-size="13" fill="#1a1a1a">VCC (3.3 V)</text>

  <circle cx="508" cy="230" r="4" fill="#227a3d"/>
  <text x="525" y="235" font-size="13" fill="#1a1a1a">DATA</text>

  <circle cx="508" cy="270" r="4" fill="#227a3d"/>
  <text x="525" y="275" font-size="13" fill="#1a1a1a">GND</text>

  <!-- Resistencia pull-up -->
  <rect x="330" y="215" width="60" height="16" fill="#fff3cd" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="360" y="227" text-anchor="middle" font-size="9.5" fill="#8a6d00">10 kΩ</text>
  <text x="360" y="205" text-anchor="middle" font-size="10" fill="#8a6d00">pull-up (si el módulo no la trae)</text>

  <!-- Connections -->
  <line x1="252" y1="185" x2="508" y2="190" stroke="#227a3d" stroke-width="2"/>
  <text x="380" y="180" text-anchor="middle" font-size="11" fill="#227a3d">3V3 → VCC</text>

  <!-- DATA con pull-up hacia VCC -->
  <line x1="252" y1="265" x2="508" y2="230" stroke="#c0392b" stroke-width="2"/>
  <text x="380" y="260" text-anchor="middle" font-size="11" fill="#c0392b">GPIO4 → DATA</text>
  <line x1="360" y1="215" x2="360" y2="195" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="360" y1="195" x2="252" y2="185" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- GND -->
  <line x1="252" y1="225" x2="508" y2="270" stroke="#555555" stroke-width="2"/>
  <text x="380" y="260" text-anchor="middle" font-size="11" fill="#555555" transform="translate(0,20)">GND → GND</text>

  <!-- Legend -->
  <rect x="60" y="345" width="14" height="14" fill="#227a3d"/>
  <text x="80" y="356" font-size="11" fill="#1a1a1a">Alimentación</text>

  <rect x="200" y="345" width="14" height="14" fill="#c0392b"/>
  <text x="220" y="356" font-size="11" fill="#1a1a1a">Señal DATA (protocolo propietario, un solo hilo)</text>

  <rect x="490" y="345" width="14" height="14" fill="#8a6d00" opacity="0.6"/>
  <text x="510" y="356" font-size="11" fill="#1a1a1a">Pull-up 10 kΩ (DATA a VCC = 3.3 V)</text>

  <text x="380" y="390" text-anchor="middle" font-size="10" fill="#777777">
    Muchos módulos AM2302/DHT22 ya incluyen la resistencia pull-up integrada — verificar antes de añadir una externa.
    GPIO4 coincide con el pin reservado por defecto al overlay 1-Wire de Raspberry Pi OS: no habilitarlo (ver README.md).
  </text>


    <text x="380" y="408" text-anchor="middle" font-size="10" fill="#c0392b">Alimentar a 3.3 V (pull-up de DATA a 3.3 V); verificar en la hoja de datos el alcance de cable con 3.3 V.</text>

  <!-- ===== Componentes pasivos (generado; ver README.md del sensor, tabla de pasivos) ===== -->
  <g id="componentes-pasivos" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="420" width="760" height="173" fill="#ffffff"/>
  <rect x="16" y="426" width="728" height="161" rx="6" fill="#fafafa" stroke="#cccccc"/>
  <text x="30" y="446" font-size="13" font-weight="bold" fill="#1a1a1a">Componentes pasivos</text>
  <line x1="190" y1="442" x2="212" y2="442" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="218" y="446" font-size="10.5" fill="#1a1a1a">externo a añadir</text>
  <line x1="340" y1="442" x2="362" y2="442" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
  <text x="368" y="446" font-size="10.5" fill="#1a1a1a">externo opcional</text>
  <line x1="490" y1="442" x2="512" y2="442" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="518" y="446" font-size="10.5" fill="#1a1a1a">ya en el módulo / placa</text>
  <text x="30" y="464" font-size="9.5" fill="#555555">Estado del valor: <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></text>
  <circle cx="42" cy="483" r="7" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><text x="42" y="487" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="482" font-size="11" font-weight="bold" fill="#1a1a1a">Raspberry Pi: sin pasivos extra<tspan font-weight="normal" font-size="9.5"></tspan></text>
  <text x="66" y="496" font-size="9.5" fill="#444444">No requiere componentes adicionales para este sensor</text>
  <line x1="30" y1="516" x2="35" y2="516" stroke="#c0392b" stroke-width="2" fill="none"/><rect x="35" y="511" width="15" height="10" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="50" y1="516" x2="55" y2="516" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="515" font-size="11" font-weight="bold" fill="#1a1a1a">Pull-up 4.7–10 kΩ (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="529" font-size="9.5" fill="#444444">Entre DATA y VCC; omitir si el módulo de 3 pines ya la trae</text>
  <line x1="30" y1="549" x2="40" y2="549" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="542" x2="40" y2="556" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="542" x2="45" y2="556" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="549" x2="55" y2="549" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="548" font-size="11" font-weight="bold" fill="#1a1a1a">100 nF cerámico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#227a3d">● hoja de datos</tspan></tspan></text>
  <text x="66" y="562" font-size="9.5" fill="#444444">Entre VCC y GND, junto al sensor (hoja AM2302: filtrado)</text>
  </g>
</svg>
