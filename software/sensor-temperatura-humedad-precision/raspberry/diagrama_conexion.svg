<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión Raspberry Pi 4 Model B — SHT31</title>
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión Raspberry Pi 4 Model B ↔ SHT31 (temperatura/HR interna)
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — sensor interno primario, bus I²C compartido con MPU6050 (sensor-vibracion)
  </text>

  <!-- Raspberry Pi 4 box -->
  <rect x="60" y="100" width="200" height="280" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Raspberry Pi 4</text>
  <text x="160" y="145" text-anchor="middle" font-size="11" fill="#555555">Model B (2GB, mínimo recomendado)</text>

  <circle cx="252" cy="185" r="4" fill="#2c5aa0"/>
  <text x="150" y="190" text-anchor="end" font-size="13" fill="#1a1a1a">3V3 (pin 1)</text>

  <circle cx="252" cy="225" r="4" fill="#2c5aa0"/>
  <text x="150" y="230" text-anchor="end" font-size="13" fill="#1a1a1a">GND (pin 9)</text>

  <circle cx="252" cy="265" r="4" fill="#2c5aa0"/>
  <text x="150" y="270" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO2 / SDA1 (pin 3)</text>

  <circle cx="252" cy="305" r="4" fill="#2c5aa0"/>
  <text x="150" y="310" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO3 / SCL1 (pin 5)</text>

  <text x="150" y="340" text-anchor="end" font-size="10" fill="#8a6d00">Bus compartido con</text>
  <text x="150" y="352" text-anchor="end" font-size="10" fill="#8a6d00">MPU6050 (sensor-vibracion)</text>

  <!-- SHT31 box -->
  <rect x="500" y="140" width="200" height="220" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="600" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">SHT31</text>
  <text x="600" y="185" text-anchor="middle" font-size="11" fill="#555555">(módulo breakout)</text>

  <circle cx="508" cy="215" r="4" fill="#227a3d"/>
  <text x="525" y="220" font-size="13" fill="#1a1a1a">VCC (3.3V)</text>

  <circle cx="508" cy="250" r="4" fill="#227a3d"/>
  <text x="525" y="255" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="508" cy="285" r="4" fill="#227a3d"/>
  <text x="525" y="290" font-size="13" fill="#1a1a1a">SDA</text>

  <circle cx="508" cy="320" r="4" fill="#227a3d"/>
  <text x="525" y="325" font-size="13" fill="#1a1a1a">SCL</text>

  <circle cx="700" cy="215" r="4" fill="#8a6d00"/>
  <text x="695" y="210" text-anchor="end" font-size="13" fill="#1a1a1a">ADDR</text>

  <!-- Connections -->
  <line x1="252" y1="185" x2="508" y2="215" stroke="#227a3d" stroke-width="2"/>
  <text x="380" y="195" text-anchor="middle" font-size="11" fill="#227a3d">3V3 → VCC</text>

  <line x1="252" y1="225" x2="508" y2="250" stroke="#555555" stroke-width="2"/>
  <text x="380" y="237" text-anchor="middle" font-size="11" fill="#555555">GND → GND</text>

  <line x1="252" y1="265" x2="508" y2="285" stroke="#2c5aa0" stroke-width="2"/>
  <text x="380" y="271" text-anchor="middle" font-size="11" fill="#2c5aa0">GPIO2 → SDA</text>

  <line x1="252" y1="305" x2="508" y2="320" stroke="#2c5aa0" stroke-width="2"/>
  <text x="380" y="306" text-anchor="middle" font-size="11" fill="#2c5aa0">GPIO3 → SCL</text>

  <!-- ADDR nota (a GND o VCC segun direccion deseada) -->
  <line x1="700" y1="215" x2="700" y2="185" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="700" y1="185" x2="252" y2="225" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Legend -->
  <rect x="60" y="405" width="14" height="14" fill="#227a3d"/>
  <text x="80" y="416" font-size="11" fill="#1a1a1a">Alimentación</text>

  <rect x="200" y="405" width="14" height="14" fill="#2c5aa0"/>
  <text x="220" y="416" font-size="11" fill="#1a1a1a">Bus I²C 1 (/dev/i2c-1, compartido)</text>

  <rect x="440" y="405" width="14" height="14" fill="#8a6d00" opacity="0.6"/>
  <text x="460" y="416" font-size="11" fill="#1a1a1a">ADDR → GND = 0x44 (usado en este proyecto)</text>

  <text x="380" y="440" text-anchor="middle" font-size="10" fill="#777777">
    ADDR a VCC selecciona la dirección alterna 0x45 — no necesario aquí: MPU6050/6500 usa 0x68/0x69, sin conflicto.
  </text>
</svg>
