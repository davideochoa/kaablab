<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 804" width="760" height="804" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión ESP32 DevKit V1 — SHT31</title>
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión ESP32 DevKit V1 ↔ SHT31 (temperatura/HR interna)
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — sensor interno primario, bus I²C compartido con MPU6050 (sensor-vibracion)
  </text>

  <!-- ESP32 DevKit V1 box -->
  <rect x="60" y="100" width="200" height="280" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">ESP32 DevKit V1</text>

  <circle cx="252" cy="170" r="4" fill="#2c5aa0"/>
  <text x="150" y="175" text-anchor="end" font-size="13" fill="#1a1a1a">3V3</text>

  <circle cx="252" cy="210" r="4" fill="#2c5aa0"/>
  <text x="150" y="215" text-anchor="end" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="252" cy="250" r="4" fill="#2c5aa0"/>
  <text x="150" y="255" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO21 (SDA)</text>

  <circle cx="252" cy="290" r="4" fill="#2c5aa0"/>
  <text x="150" y="295" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO22 (SCL)</text>

  <text x="150" y="325" text-anchor="end" font-size="10" fill="#8a6d00">Bus compartido con</text>
  <text x="150" y="337" text-anchor="end" font-size="10" fill="#8a6d00">MPU6050 (sensor-vibracion)</text>

  <!-- SHT31 box -->
  <rect x="500" y="120" width="200" height="220" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="600" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">SHT31</text>
  <text x="600" y="165" text-anchor="middle" font-size="11" fill="#555555">(módulo breakout)</text>

  <circle cx="508" cy="195" r="4" fill="#227a3d"/>
  <text x="525" y="200" font-size="13" fill="#1a1a1a">VCC (3.3V)</text>

  <circle cx="508" cy="230" r="4" fill="#227a3d"/>
  <text x="525" y="235" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="508" cy="265" r="4" fill="#227a3d"/>
  <text x="525" y="270" font-size="13" fill="#1a1a1a">SDA</text>

  <circle cx="508" cy="300" r="4" fill="#227a3d"/>
  <text x="525" y="305" font-size="13" fill="#1a1a1a">SCL</text>

  <circle cx="700" cy="195" r="4" fill="#8a6d00"/>
  <text x="695" y="190" text-anchor="end" font-size="13" fill="#1a1a1a">ADDR</text>

  <!-- Connections -->
  <line x1="252" y1="170" x2="508" y2="195" stroke="#227a3d" stroke-width="2"/>
  <text x="380" y="177" text-anchor="middle" font-size="11" fill="#227a3d">3V3 → VCC</text>

  <line x1="252" y1="210" x2="508" y2="230" stroke="#555555" stroke-width="2"/>
  <text x="380" y="215" text-anchor="middle" font-size="11" fill="#555555">GND → GND</text>

  <line x1="252" y1="250" x2="508" y2="265" stroke="#2c5aa0" stroke-width="2"/>
  <text x="380" y="252" text-anchor="middle" font-size="11" fill="#2c5aa0">GPIO21 → SDA</text>

  <line x1="252" y1="290" x2="508" y2="300" stroke="#2c5aa0" stroke-width="2"/>
  <text x="380" y="288" text-anchor="middle" font-size="11" fill="#2c5aa0">GPIO22 → SCL</text>

  <!-- ADDR nota (a GND o VCC segun direccion deseada) -->
  <line x1="700" y1="195" x2="700" y2="170" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="700" y1="170" x2="252" y2="210" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Legend -->
  <rect x="60" y="405" width="14" height="14" fill="#227a3d"/>
  <text x="80" y="416" font-size="11" fill="#1a1a1a">Alimentación</text>

  <rect x="200" y="405" width="14" height="14" fill="#2c5aa0"/>
  <text x="220" y="416" font-size="11" fill="#1a1a1a">Bus I²C (compartido)</text>

  <rect x="400" y="405" width="14" height="14" fill="#8a6d00" opacity="0.6"/>
  <text x="420" y="416" font-size="11" fill="#1a1a1a">ADDR → GND = 0x44 (usado en este proyecto)</text>

  <text x="380" y="440" text-anchor="middle" font-size="10" fill="#777777">
    ADDR a VCC selecciona la dirección alterna 0x45 — usar solo si 0x44 choca con otro dispositivo del bus (no aplica aquí: MPU6050/6500 usa 0x68/0x69).
  </text>


  <!-- ===== Componentes pasivos (generado; ver README.md del sensor, tabla de pasivos) ===== -->
  <g id="componentes-pasivos" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="460" width="760" height="344" fill="#ffffff"/>
  <rect x="16" y="466" width="728" height="332" rx="6" fill="#fafafa" stroke="#cccccc"/>
  <text x="30" y="486" font-size="13" font-weight="bold" fill="#1a1a1a">Componentes pasivos</text>
  <line x1="190" y1="482" x2="212" y2="482" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="218" y="486" font-size="10.5" fill="#1a1a1a">externo a añadir</text>
  <line x1="340" y1="482" x2="362" y2="482" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
  <text x="368" y="486" font-size="10.5" fill="#1a1a1a">externo opcional</text>
  <line x1="490" y1="482" x2="512" y2="482" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="518" y="486" font-size="10.5" fill="#1a1a1a">ya en el módulo / placa</text>
  <text x="30" y="504" font-size="9.5" fill="#555555">Estado del valor: <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></text>
  <line x1="30" y1="523" x2="40" y2="523" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="516" x2="40" y2="530" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="516" x2="45" y2="530" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="523" x2="55" y2="523" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="522" font-size="11" font-weight="bold" fill="#1a1a1a">100 µF electrolítico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="536" font-size="9.5" fill="#444444">Entre 3V3 y GND de la ESP32, junto a la placa — valor de diseño, no tomado de hoja de datos</text>
  <line x1="30" y1="556" x2="40" y2="556" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="549" x2="40" y2="563" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="549" x2="45" y2="563" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="556" x2="55" y2="556" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="555" font-size="11" font-weight="bold" fill="#1a1a1a">100 nF cerámico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="569" font-size="9.5" fill="#444444">Entre 3V3 y GND de la ESP32, en paralelo con el de 100 µF — valor de diseño</text>
  <line x1="30" y1="589" x2="38" y2="589" stroke="#c0392b" stroke-width="2" fill="none"/><polygon points="38,583 38,595 47,589" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="47" y1="583" x2="47" y2="595" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="47" y1="589" x2="55" y2="589" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="588" font-size="11" font-weight="bold" fill="#1a1a1a">1N4007 en serie (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="602" font-size="9.5" fill="#444444">Solo en la entrada externa de 6.5–16 V hacia VIN; NO en el riel de 5 V/USB. Caída ≈ 1.1 V a 1 A (hoja 1N4007). Tope del regulador de la</text>
  <text x="66" y="615" font-size="9.5" fill="#444444">placa no confirmado</text>
  <line x1="30" y1="635" x2="40" y2="635" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="628" x2="40" y2="642" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="628" x2="45" y2="642" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="635" x2="55" y2="635" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="634" font-size="11" font-weight="bold" fill="#1a1a1a">100 nF cerámico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="648" font-size="9.5" fill="#444444">Entre VDD y GND, lo más cerca posible del sensor (hoja SHT3x-DIS); el breakout puede traerlo</text>
  <line x1="30" y1="668" x2="35" y2="668" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><rect x="35" y="663" width="15" height="10" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><line x1="50" y1="668" x2="55" y2="668" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="66" y="667" font-size="11" font-weight="bold" fill="#1a1a1a">Pull-ups SDA/SCL del breakout<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="681" font-size="9.5" fill="#444444">En el módulo; la hoja usa 10 kΩ como ejemplo. ADDR a GND → 0x44</text>
  <circle cx="42" cy="701" r="7" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><text x="42" y="705" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="700" font-size="11" font-weight="bold" fill="#1a1a1a">Bus I²C: sin pull-ups extra<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="714" font-size="9.5" fill="#444444">Si los módulos ya los traen, no añadir. Añadir 4.7 kΩ o 5.1 kΩ (SDA y SCL a 3.3 V) solo si ningún módulo los trae o el analizador lógico</text>
  <text x="66" y="727" font-size="9.5" fill="#444444">muestra flancos lentos</text>
  <circle cx="42" cy="747" r="7" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><text x="42" y="751" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="746" font-size="11" font-weight="bold" fill="#1a1a1a">DS3231: circuito de carga de la pila<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="760" font-size="9.5" fill="#444444">Módulos baratos (ZS-042) cargan la pila desde VCC (≈200 Ω + diodo): usar LIR2032, o con CR2032 retirar el diodo o la resistencia de</text>
  <text x="66" y="773" font-size="9.5" fill="#444444">carga (fuente: foros, no hoja de datos)</text>
  </g>
</svg>
