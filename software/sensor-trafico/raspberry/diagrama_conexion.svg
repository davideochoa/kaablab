<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 693" width="800" height="693" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión Raspberry Pi 4 Model B — 4 módulos TCRT5000 reflectivos (doble haz)</title>
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión Raspberry Pi 4 Model B ↔ 4 módulos TCRT5000 reflectivos (doble haz)
  </text>
  <text x="400" y="46" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — conteo direccional de tráfico en piquera (esquema, no a escala) · equivalente a arduino/diagrama_conexion.svg
  </text>

  <!-- Raspberry Pi 4 box -->
  <rect x="30" y="90" width="190" height="340" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="125" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Raspberry Pi 4</text>
  <text x="125" y="134" text-anchor="middle" font-size="10" fill="#555555">Model B (2GB, mínimo recomendado)</text>

  <circle cx="212" cy="160" r="4" fill="#2c5aa0"/>
  <text x="130" y="165" text-anchor="end" font-size="12" fill="#1a1a1a">3V3 (bus VCC, pin 1)</text>

  <circle cx="212" cy="195" r="4" fill="#555555"/>
  <text x="130" y="200" text-anchor="end" font-size="12" fill="#1a1a1a">GND (bus GND, pin 9)</text>

  <circle cx="212" cy="240" r="4" fill="#c0392b"/>
  <text x="130" y="245" text-anchor="end" font-size="12" fill="#1a1a1a">GPIO5 (pin 29) — Haz A principal</text>

  <circle cx="212" cy="275" r="4" fill="#e08a3c"/>
  <text x="130" y="280" text-anchor="end" font-size="12" fill="#1a1a1a">GPIO6 (pin 31) — Haz A secundario</text>

  <circle cx="212" cy="330" r="4" fill="#227a3d"/>
  <text x="130" y="335" text-anchor="end" font-size="12" fill="#1a1a1a">GPIO12 (pin 32) — Haz B principal</text>

  <circle cx="212" cy="365" r="4" fill="#7a2ca0"/>
  <text x="130" y="370" text-anchor="end" font-size="12" fill="#1a1a1a">GPIO13 (pin 33) — Haz B secundario</text>

  <!-- Tube cross-section with 4 modules TCRT5000 reflectivos (2 por haz) -->
  <defs>
    <marker id="flechaIR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b03a2e"/>
    </marker>
  </defs>
  <rect x="440" y="150" width="200" height="220" rx="10" fill="#fdf8ef" stroke="#7a5a30" stroke-width="2"/>
  <text x="540" y="140" text-anchor="middle" font-size="11" fill="#7a5a30">Tubo de la piquera (≈15 mm de diámetro)</text>

  <!-- Haz A: modulo A1 (principal) arriba, A2 (secundario) abajo; ambos reflectivos -->
  <rect x="470" y="100" width="70" height="30" rx="4" fill="#eef3fb" stroke="#c0392b" stroke-width="2"/>
  <text x="505" y="120" text-anchor="middle" font-size="10" fill="#1a1a1a">Módulo A1</text>
  <text x="505" y="90" text-anchor="middle" font-size="9.5" fill="#c0392b">OUT → GPIO5 (principal)</text>

  <rect x="470" y="390" width="70" height="30" rx="4" fill="#fdf0e4" stroke="#e08a3c" stroke-width="2"/>
  <text x="505" y="409" text-anchor="middle" font-size="10" fill="#1a1a1a">Módulo A2</text>
  <text x="505" y="435" text-anchor="middle" font-size="9.5" fill="#e08a3c">OUT → GPIO6 (secundario)</text>

  <!-- Haz A: cono de emisión de cada cabeza óptica (sin haz directo entre módulos) -->
  <polygon points="505,130 487,190 523,190" fill="#c0392b" fill-opacity="0.18" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>
  <polygon points="505,390 487,330 523,330" fill="#e08a3c" fill-opacity="0.18" stroke="#e08a3c" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Par B: modulo B1 (principal) arriba, B2 (secundario) abajo, >= ~10 mm mas adelante (a validar) -->
  <rect x="560" y="100" width="70" height="30" rx="4" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="595" y="120" text-anchor="middle" font-size="10" fill="#1a1a1a">Módulo B1</text>
  <text x="595" y="90" text-anchor="middle" font-size="9.5" fill="#227a3d">OUT → GPIO12 (principal)</text>

  <rect x="560" y="390" width="70" height="30" rx="4" fill="#f2e9f7" stroke="#7a2ca0" stroke-width="2"/>
  <text x="595" y="409" text-anchor="middle" font-size="10" fill="#1a1a1a">Módulo B2</text>
  <text x="595" y="435" text-anchor="middle" font-size="9.5" fill="#7a2ca0">OUT → GPIO13 (secundario)</text>

  <!-- Haz B: cono de emisión de cada cabeza óptica (sin haz directo entre módulos) -->
  <polygon points="595,130 577,190 613,190" fill="#227a3d" fill-opacity="0.18" stroke="#227a3d" stroke-width="1" stroke-dasharray="3,2"/>
  <polygon points="595,390 577,330 613,330" fill="#7a2ca0" fill-opacity="0.18" stroke="#7a2ca0" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Abeja dentro del tubo y reflexión IR hacia cada cabeza (emitido → abeja → reflejado) -->
  <line x1="505" y1="136" x2="542" y2="252" stroke="#b03a2e" stroke-width="1.2" marker-start="url(#flechaIR)" marker-end="url(#flechaIR)"/>
  <line x1="505" y1="384" x2="542" y2="268" stroke="#b03a2e" stroke-width="1.2" marker-start="url(#flechaIR)" marker-end="url(#flechaIR)"/>
  <line x1="595" y1="136" x2="558" y2="252" stroke="#b03a2e" stroke-width="1.2" marker-start="url(#flechaIR)" marker-end="url(#flechaIR)"/>
  <line x1="595" y1="384" x2="558" y2="268" stroke="#b03a2e" stroke-width="1.2" marker-start="url(#flechaIR)" marker-end="url(#flechaIR)"/>
  <ellipse cx="550" cy="260" rx="13" ry="8" fill="#f5c518" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="550" y="282" text-anchor="middle" font-size="9.5" fill="#555555">abeja (refleja el IR)</text>
  <text x="540" y="362" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8a6d00">Geometría a validar con el experto</text>


  <text x="550" y="145" text-anchor="middle" font-size="9.5" fill="#8a6d00">Separación entre haces ≥ ~10 mm (cabeza óptica del TCRT5000, no la placa), a validar</text>

  <!-- VCC / GND bus lines a los 4 modulos -->
  <line x1="220" y1="160" x2="720" y2="160" stroke="#2c5aa0" stroke-width="1.5"/>
  <line x1="720" y1="160" x2="720" y2="80" stroke="#2c5aa0" stroke-width="1.5"/>
  <line x1="720" y1="80" x2="505" y2="80" stroke="#2c5aa0" stroke-width="1.5"/>
  <line x1="505" y1="80" x2="505" y2="100" stroke="#2c5aa0" stroke-width="1.5"/>
  <line x1="720" y1="80" x2="595" y2="80" stroke="#2c5aa0" stroke-width="1.5"/>
  <line x1="595" y1="80" x2="595" y2="100" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="660" y="74" text-anchor="middle" font-size="9.5" fill="#2c5aa0">VCC a los 4 módulos</text>

  <line x1="220" y1="195" x2="740" y2="195" stroke="#555555" stroke-width="1.5"/>
  <line x1="740" y1="195" x2="740" y2="480" stroke="#555555" stroke-width="1.5"/>
  <line x1="740" y1="480" x2="505" y2="480" stroke="#555555" stroke-width="1.5"/>
  <line x1="505" y1="480" x2="505" y2="420" stroke="#555555" stroke-width="1.5"/>
  <line x1="740" y1="480" x2="595" y2="480" stroke="#555555" stroke-width="1.5"/>
  <line x1="595" y1="480" x2="595" y2="420" stroke="#555555" stroke-width="1.5"/>
  <text x="660" y="495" text-anchor="middle" font-size="9.5" fill="#555555">GND a los 4 módulos</text>

  <!-- señal GPIO5 (A1 principal) -->
  <line x1="220" y1="240" x2="380" y2="240" stroke="#c0392b" stroke-width="2"/>
  <line x1="380" y1="240" x2="380" y2="115" stroke="#c0392b" stroke-width="2"/>
  <line x1="380" y1="115" x2="470" y2="115" stroke="#c0392b" stroke-width="2"/>

  <!-- señal GPIO6 (A2 secundario) -->
  <line x1="220" y1="275" x2="400" y2="275" stroke="#e08a3c" stroke-width="2"/>
  <line x1="400" y1="275" x2="400" y2="405" stroke="#e08a3c" stroke-width="2"/>
  <line x1="400" y1="405" x2="470" y2="405" stroke="#e08a3c" stroke-width="2"/>

  <!-- señal GPIO12 (B1 principal) -->
  <line x1="220" y1="330" x2="420" y2="330" stroke="#227a3d" stroke-width="2"/>
  <line x1="420" y1="330" x2="420" y2="115" stroke="#227a3d" stroke-width="2"/>
  <line x1="420" y1="115" x2="560" y2="115" stroke="#227a3d" stroke-width="2"/>

  <!-- señal GPIO13 (B2 secundario) -->
  <line x1="220" y1="365" x2="440" y2="365" stroke="#7a2ca0" stroke-width="2"/>
  <line x1="440" y1="365" x2="440" y2="405" stroke="#7a2ca0" stroke-width="2"/>
  <line x1="440" y1="405" x2="560" y2="405" stroke="#7a2ca0" stroke-width="2"/>

  <!-- Nota -->
  <rect x="30" y="440" width="740" height="65" rx="6" fill="#fff8e6" stroke="#8a6d00" stroke-width="1"/>
  <text x="42" y="458" font-size="10.5" fill="#1a1a1a">Doble haz = 2 zonas × 2 módulos TCRT5000 reflectivos (sin haz directo). Detección por eventos (RPi.GPIO add_event_detect), no por</text>
  <text x="42" y="472" font-size="10.5" fill="#1a1a1a">polling ni DMA — latencia de callback típicamente en milisegundos, riesgo para el orden A/B (ver raspberry/conteo_trafico.py).</text>
  <text x="42" y="486" font-size="10.5" fill="#1a1a1a">Rango declarado por el fabricante del TCRT5000: 0.2–15 mm (pico 2.5 mm), pendiente de validar en banco; tubo ≈15 mm — ver README §1.</text>
  <text x="42" y="500" font-size="10" fill="#c0392b">Módulos a 3.3 V, no 5 V (D0 subiría a 5 V y la entrada GPIO no lo tolera): alimentar a 3.3 V; validar la sensibilidad en banco.</text>

  <!-- Legend -->
  <rect x="30" y="60" width="14" height="14" fill="#2c5aa0"/>
  <text x="50" y="71" font-size="10" fill="#1a1a1a">VCC</text>

  <rect x="90" y="60" width="14" height="14" fill="#555555"/>
  <text x="110" y="71" font-size="10" fill="#1a1a1a">GND</text>

  <rect x="150" y="60" width="14" height="14" fill="#c0392b"/>
  <text x="170" y="71" font-size="10" fill="#1a1a1a">Haz A principal (GPIO5)</text>

  <rect x="330" y="60" width="14" height="14" fill="#e08a3c"/>
  <text x="350" y="71" font-size="10" fill="#1a1a1a">Haz A secundario (GPIO6)</text>

  <rect x="530" y="60" width="14" height="14" fill="#227a3d"/>
  <text x="550" y="71" font-size="10" fill="#1a1a1a">Haz B principal (GPIO12)</text>

  <rect x="30" y="78" width="14" height="14" fill="#7a2ca0"/>
  <text x="50" y="89" font-size="10" fill="#1a1a1a">Haz B secundario (GPIO13)</text>


  <!-- ===== Componentes pasivos (generado; ver README.md del sensor, tabla de pasivos) ===== -->
  <g id="componentes-pasivos" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="520" width="800" height="173" fill="#ffffff"/>
  <rect x="16" y="526" width="768" height="161" rx="6" fill="#fafafa" stroke="#cccccc"/>
  <text x="30" y="546" font-size="13" font-weight="bold" fill="#1a1a1a">Componentes pasivos</text>
  <line x1="190" y1="542" x2="212" y2="542" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="218" y="546" font-size="10.5" fill="#1a1a1a">externo a añadir</text>
  <line x1="340" y1="542" x2="362" y2="542" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
  <text x="368" y="546" font-size="10.5" fill="#1a1a1a">externo opcional</text>
  <line x1="490" y1="542" x2="512" y2="542" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="518" y="546" font-size="10.5" fill="#1a1a1a">ya en el módulo / placa</text>
  <text x="30" y="564" font-size="9.5" fill="#555555">Estado del valor: <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></text>
  <circle cx="42" cy="583" r="7" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><text x="42" y="587" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="582" font-size="11" font-weight="bold" fill="#1a1a1a">Raspberry Pi: sin pasivos extra<tspan font-weight="normal" font-size="9.5"></tspan></text>
  <text x="66" y="596" font-size="9.5" fill="#444444">No requiere componentes adicionales para este sensor</text>
  <circle cx="42" cy="616" r="7" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><text x="42" y="620" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="615" font-size="11" font-weight="bold" fill="#1a1a1a">TCRT5000: sin pasivos obligatorios<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="629" font-size="9.5" fill="#444444">Resistencias del LED IR y del comparador LM393 ya en cada módulo (×4)</text>
  <line x1="30" y1="649" x2="40" y2="649" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/><line x1="40" y1="642" x2="40" y2="656" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/><line x1="45" y1="642" x2="45" y2="656" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/><line x1="45" y1="649" x2="55" y2="649" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
  <text x="66" y="648" font-size="11" font-weight="bold" fill="#1a1a1a">100 nF cerámico (×4, opcional)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="662" font-size="9.5" fill="#444444">Entre VCC y GND de cada módulo, junto a sus pines</text>
  </g>
</svg>
