<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión Raspberry Pi 4 Model B — MPU6050/MPU6500</title>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión Raspberry Pi 4 Model B ↔ MPU6050 / MPU6500
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — vibración estructural (banda objetivo 300–600 Hz) · equivalente a arduino/diagrama_conexion.svg
  </text>

  <!-- Raspberry Pi 4 box -->
  <rect x="60" y="100" width="200" height="220" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Raspberry Pi 4</text>
  <text x="160" y="145" text-anchor="middle" font-size="11" fill="#555555">Model B (2GB, mínimo recomendado)</text>

  <!-- Raspberry Pi pins -->
  <circle cx="252" cy="185" r="4" fill="#2c5aa0"/>
  <text x="150" y="190" text-anchor="end" font-size="13" fill="#1a1a1a">3V3 (pin 1)</text>

  <circle cx="252" cy="225" r="4" fill="#2c5aa0"/>
  <text x="150" y="230" text-anchor="end" font-size="13" fill="#1a1a1a">GND (pin 9)</text>

  <circle cx="252" cy="265" r="4" fill="#2c5aa0"/>
  <text x="150" y="270" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO2 / SDA1 (pin 3)</text>

  <circle cx="252" cy="305" r="4" fill="#2c5aa0"/>
  <text x="150" y="310" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO3 / SCL1 (pin 5)</text>

  <!-- MPU6050 box -->
  <rect x="500" y="140" width="200" height="180" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="600" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">MPU6050 / MPU6500</text>
  <text x="600" y="185" text-anchor="middle" font-size="11" fill="#555555">(módulo GY-521)</text>

  <circle cx="508" cy="225" r="4" fill="#227a3d"/>
  <text x="525" y="230" font-size="13" fill="#1a1a1a">VCC (3.3V)</text>

  <circle cx="508" cy="265" r="4" fill="#227a3d"/>
  <text x="525" y="270" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="508" cy="305" r="4" fill="#227a3d"/>
  <text x="525" y="310" font-size="13" fill="#1a1a1a">SDA</text>

  <circle cx="508" cy="345" r="4" fill="#227a3d"/>
  <text x="525" y="350" font-size="13" fill="#1a1a1a">SCL</text>

  <!-- Connections -->
  <!-- VCC -->
  <line x1="252" y1="185" x2="508" y2="225" stroke="#227a3d" stroke-width="2"/>
  <text x="380" y="195" text-anchor="middle" font-size="11" fill="#227a3d">3V3 → VCC</text>

  <!-- GND -->
  <line x1="252" y1="225" x2="508" y2="265" stroke="#555555" stroke-width="2"/>
  <text x="380" y="237" text-anchor="middle" font-size="11" fill="#555555">GND → GND</text>

  <!-- SDA -->
  <line x1="252" y1="265" x2="508" y2="305" stroke="#2c5aa0" stroke-width="2"/>
  <text x="380" y="279" text-anchor="middle" font-size="11" fill="#2c5aa0">GPIO2 → SDA</text>

  <!-- SCL -->
  <line x1="252" y1="305" x2="508" y2="345" stroke="#2c5aa0" stroke-width="2"/>
  <text x="380" y="319" text-anchor="middle" font-size="11" fill="#2c5aa0">GPIO3 → SCL</text>

  <!-- Legend -->
  <rect x="60" y="355" width="14" height="14" fill="#227a3d"/>
  <text x="80" y="366" font-size="11" fill="#1a1a1a">Alimentación</text>

  <rect x="200" y="355" width="14" height="14" fill="#2c5aa0"/>
  <text x="220" y="366" font-size="11" fill="#1a1a1a">Bus I²C 1 (/dev/i2c-1)</text>

  <text x="380" y="395" text-anchor="middle" font-size="10" fill="#777777">
    Bus I²C compartido con el sensor de temperatura/humedad de precisión (sensor-temperatura-humedad-precision/raspberry/).
    Sin pin INT: este código Python implementa solo el equivalente de la Ruta A (polling), no la Ruta B (interrupción + FIFO).
  </text>
</svg>
