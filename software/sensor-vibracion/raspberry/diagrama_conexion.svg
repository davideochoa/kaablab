<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 785" width="760" height="785" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión Raspberry Pi 4 Model B — MPU6500 (0x69) y DS3231 (0x68)</title>
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión Raspberry Pi 4 Model B ↔ MPU6500 (GY-6500)
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — vibración estructural (banda objetivo 300–600 Hz) · equivalente a ../arduino/diagrama_conexion.svg
  </text>

  <!-- Raspberry Pi 4 box -->
  <rect x="40" y="90" width="230" height="250" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="155" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Raspberry Pi 4</text>
  <text x="155" y="135" text-anchor="middle" font-size="11" fill="#555555">Model B (2GB, mínimo recomendado)</text>

  <circle cx="262" cy="180" r="4" fill="#2c5aa0"/>
  <text x="250" y="185" text-anchor="end" font-size="13" fill="#1a1a1a">3V3 (pin 1)</text>
  <circle cx="262" cy="220" r="4" fill="#2c5aa0"/>
  <text x="250" y="225" text-anchor="end" font-size="13" fill="#1a1a1a">GND (pin 9)</text>
  <circle cx="262" cy="260" r="4" fill="#2c5aa0"/>
  <text x="250" y="265" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO2 / SDA1 (pin 3)</text>
  <circle cx="262" cy="300" r="4" fill="#2c5aa0"/>
  <text x="250" y="305" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO3 / SCL1 (pin 5)</text>

  <!-- MPU6500 box -->
  <rect x="500" y="80" width="220" height="210" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="610" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">MPU6500</text>
  <text x="610" y="122" text-anchor="middle" font-size="11" fill="#555555">(módulo GY-6500) · I²C 0x69</text>

  <circle cx="508" cy="160" r="4" fill="#227a3d"/>
  <text x="522" y="165" font-size="13" fill="#1a1a1a">VCC (3.3V)</text>
  <circle cx="508" cy="190" r="4" fill="#227a3d"/>
  <text x="522" y="195" font-size="13" fill="#1a1a1a">GND</text>
  <circle cx="508" cy="220" r="4" fill="#227a3d"/>
  <text x="522" y="225" font-size="13" fill="#1a1a1a">SDA</text>
  <circle cx="508" cy="250" r="4" fill="#227a3d"/>
  <text x="522" y="255" font-size="13" fill="#1a1a1a">SCL</text>
  <circle cx="508" cy="275" r="4" fill="#c0392b"/>
  <text x="522" y="280" font-size="13" fill="#c0392b">AD0 → 3.3V (0x69)</text>

  <!-- DS3231 box -->
  <rect x="500" y="320" width="220" height="100" rx="8" fill="#fbf6ee" stroke="#a0662c" stroke-width="2"/>
  <text x="610" y="344" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">DS3231 (RTC)</text>
  <text x="610" y="360" text-anchor="middle" font-size="11" fill="#555555">I²C 0x68 · reloj del sistema</text>
  <circle cx="508" cy="385" r="4" fill="#a0662c"/>
  <text x="522" y="390" font-size="12" fill="#1a1a1a">VCC · GND · SDA · SCL</text>
  <text x="522" y="408" font-size="11" fill="#555555">mismo bus I²C 1</text>

  <!-- Connections to MPU6500 -->
  <line x1="262" y1="180" x2="508" y2="160" stroke="#227a3d" stroke-width="2"/>
  <line x1="262" y1="180" x2="508" y2="275" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="262" y1="220" x2="508" y2="190" stroke="#555555" stroke-width="2"/>
  <line x1="262" y1="260" x2="508" y2="220" stroke="#2c5aa0" stroke-width="2"/>
  <line x1="262" y1="300" x2="508" y2="250" stroke="#2c5aa0" stroke-width="2"/>

  <!-- Shared bus to DS3231 -->
  <line x1="262" y1="260" x2="508" y2="385" stroke="#2c5aa0" stroke-width="1.5" stroke-dasharray="2,3"/>
  <line x1="262" y1="300" x2="508" y2="385" stroke="#2c5aa0" stroke-width="1.5" stroke-dasharray="2,3"/>

  <!-- Legend -->
  <rect x="40" y="365" width="14" height="14" fill="#227a3d"/>
  <text x="60" y="376" font-size="11" fill="#1a1a1a">Alimentación</text>
  <rect x="160" y="365" width="14" height="14" fill="#2c5aa0"/>
  <text x="180" y="376" font-size="11" fill="#1a1a1a">Bus I²C 1 (/dev/i2c-1)</text>
  <rect x="40" y="388" width="14" height="14" fill="#c0392b"/>
  <text x="60" y="399" font-size="11" fill="#1a1a1a">AD0 a 3.3V: dirección 0x69</text>

  <text x="380" y="450" text-anchor="middle" font-size="10" fill="#777777">
    Bus I²C compartido: SHT31 0x44 (sensor-temperatura-humedad-precision/raspberry/), DS3231 0x68 (RTC del sistema, dtoverlay=i2c-rtc,ds3231), MPU6500 0x69.
  </text>
  <text x="380" y="466" text-anchor="middle" font-size="10" fill="#777777">
    Sin pin INT: este código Python implementa solo el equivalente de la Ruta A (polling), no la Ruta B (interrupción + FIFO).
  </text>


  <!-- ===== Componentes pasivos (generado; ver README.md del sensor, tabla de pasivos) ===== -->
  <g id="componentes-pasivos" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="500" width="760" height="285" fill="#ffffff"/>
  <rect x="16" y="506" width="728" height="273" rx="6" fill="#fafafa" stroke="#cccccc"/>
  <text x="30" y="526" font-size="13" font-weight="bold" fill="#1a1a1a">Componentes pasivos</text>
  <line x1="190" y1="522" x2="212" y2="522" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="218" y="526" font-size="10.5" fill="#1a1a1a">externo a añadir</text>
  <line x1="340" y1="522" x2="362" y2="522" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
  <text x="368" y="526" font-size="10.5" fill="#1a1a1a">externo opcional</text>
  <line x1="490" y1="522" x2="512" y2="522" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="518" y="526" font-size="10.5" fill="#1a1a1a">ya en el módulo / placa</text>
  <text x="30" y="544" font-size="9.5" fill="#555555">Estado del valor: <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></text>
  <circle cx="42" cy="563" r="7" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><text x="42" y="567" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="562" font-size="11" font-weight="bold" fill="#1a1a1a">Raspberry Pi: sin pasivos extra<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="576" font-size="9.5" fill="#444444">La placa ya trae pull-ups de 1.8 kΩ a 3.3 V en GPIO2/GPIO3 (pinout.xyz, MathWorks; no hoja oficial)</text>
  <line x1="30" y1="596" x2="40" y2="596" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="589" x2="40" y2="603" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="589" x2="45" y2="603" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="596" x2="55" y2="596" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="595" font-size="11" font-weight="bold" fill="#1a1a1a">100 nF cerámico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="609" font-size="9.5" fill="#444444">Entre VCC y GND, lo más cerca posible del pin VCC del módulo GY-6500 (hoja MPU-6500: 0.1 µF X7R en VDD)</text>
  <line x1="30" y1="629" x2="40" y2="629" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><line x1="40" y1="622" x2="40" y2="636" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><line x1="45" y1="622" x2="45" y2="636" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><line x1="45" y1="629" x2="55" y2="629" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="66" y="628" font-size="11" font-weight="bold" fill="#1a1a1a">0.1 µF VDD · 0.1 µF REGOUT · 10 nF VDDIO<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="642" font-size="9.5" fill="#444444">En el módulo, junto al chip (hoja PS-MPU-6500A-01, tabla de pines)</text>
  <circle cx="42" cy="662" r="7" stroke="#c0392b" stroke-width="2" fill="none"/><text x="42" y="666" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="661" font-size="11" font-weight="bold" fill="#1a1a1a">AD0 a 3.3 V → dirección 0x69<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="675" font-size="9.5" fill="#444444">El módulo trae pull-down en AD0 (0x68 por defecto); puentear AD0 a 3.3 V porque 0x68 es del DS3231</text>
  <circle cx="42" cy="695" r="7" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><text x="42" y="699" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="694" font-size="11" font-weight="bold" fill="#1a1a1a">Bus I²C: sin pull-ups extra<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="708" font-size="9.5" fill="#444444">Nunca añadir: 1.8 kΩ de la placa + los de cada módulo ya quedan en paralelo. Si el bus falla, retirar los del módulo, no añadir más</text>
  <circle cx="42" cy="728" r="7" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><text x="42" y="732" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="727" font-size="11" font-weight="bold" fill="#1a1a1a">DS3231: circuito de carga de la pila<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="741" font-size="9.5" fill="#444444">Módulos baratos (ZS-042) cargan la pila desde VCC (≈200 Ω + diodo): usar LIR2032, o con CR2032 retirar el diodo o la resistencia de</text>
  <text x="66" y="754" font-size="9.5" fill="#444444">carga (fuente: foros, no hoja de datos)</text>
  </g>
</svg>
