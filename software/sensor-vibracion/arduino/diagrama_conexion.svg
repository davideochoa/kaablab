<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 857" width="760" height="857" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión ESP32 DevKit V1 — MPU6500</title>
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión ESP32 DevKit V1 ↔ MPU6500
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — vibración estructural (banda objetivo 300–600 Hz)
  </text>

  <!-- ESP32 DevKit V1 box -->
  <rect x="60" y="100" width="200" height="300" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">ESP32 DevKit V1</text>

  <!-- ESP32 pins -->
  <circle cx="252" cy="170" r="4" fill="#2c5aa0"/>
  <text x="150" y="175" text-anchor="end" font-size="13" fill="#1a1a1a">3V3</text>

  <circle cx="252" cy="210" r="4" fill="#2c5aa0"/>
  <text x="150" y="215" text-anchor="end" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="252" cy="250" r="4" fill="#2c5aa0"/>
  <text x="150" y="255" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO21 (SDA)</text>

  <circle cx="252" cy="290" r="4" fill="#2c5aa0"/>
  <text x="150" y="295" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO22 (SCL)</text>

  <circle cx="252" cy="330" r="4" fill="#8a6d00"/>
  <text x="150" y="335" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO13 (INT)</text>
  <text x="150" y="350" text-anchor="end" font-size="10" fill="#8a6d00">Ruta B, opcional —</text>
  <text x="150" y="362" text-anchor="end" font-size="10" fill="#8a6d00">GPIO13 confirmado (Tabla 2.3)</text>

  <!-- MPU6500 box -->
  <rect x="500" y="140" width="200" height="220" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="600" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">MPU6500</text>
  <text x="600" y="185" text-anchor="middle" font-size="11" fill="#555555">(módulo GY-6500)</text>

  <circle cx="508" cy="210" r="4" fill="#227a3d"/>
  <text x="525" y="215" font-size="13" fill="#1a1a1a">VCC (3.3V)</text>

  <circle cx="508" cy="250" r="4" fill="#227a3d"/>
  <text x="525" y="255" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="508" cy="290" r="4" fill="#227a3d"/>
  <text x="525" y="295" font-size="13" fill="#1a1a1a">SDA</text>

  <circle cx="508" cy="330" r="4" fill="#227a3d"/>
  <text x="525" y="335" font-size="13" fill="#1a1a1a">SCL</text>

  <circle cx="700" cy="210" r="4" fill="#8a6d00"/>
  <text x="695" y="205" text-anchor="end" font-size="13" fill="#1a1a1a">INT</text>

  <!-- Nota AD0 (el pin no se dibuja: dirección I2C 0x69) -->
  <text x="600" y="376" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#227a3d">AD0 → 3.3V (no a GND)</text>
  <text x="600" y="390" text-anchor="middle" font-size="10" fill="#227a3d">Dirección I²C 0x69: evita el</text>
  <text x="600" y="403" text-anchor="middle" font-size="10" fill="#227a3d">choque con el DS3231 (0x68)</text>

  <!-- Connections -->
  <!-- VCC -->
  <line x1="252" y1="170" x2="508" y2="210" stroke="#227a3d" stroke-width="2"/>
  <text x="380" y="180" text-anchor="middle" font-size="11" fill="#227a3d">3V3 → VCC</text>

  <!-- GND -->
  <line x1="252" y1="210" x2="508" y2="250" stroke="#555555" stroke-width="2"/>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#555555">GND → GND</text>

  <!-- SDA -->
  <line x1="252" y1="250" x2="508" y2="290" stroke="#2c5aa0" stroke-width="2"/>
  <text x="380" y="264" text-anchor="middle" font-size="11" fill="#2c5aa0">GPIO21 → SDA</text>

  <!-- SCL -->
  <line x1="252" y1="290" x2="508" y2="330" stroke="#2c5aa0" stroke-width="2"/>
  <text x="380" y="304" text-anchor="middle" font-size="11" fill="#2c5aa0">GPIO22 → SCL</text>

  <!-- INT (optional, dashed) -->
  <line x1="252" y1="330" x2="700" y2="210" stroke="#8a6d00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="470" y="255" text-anchor="middle" font-size="11" fill="#8a6d00">GPIO13 → INT (Ruta B, opcional)</text>

  <!-- Legend -->
  <rect x="60" y="415" width="14" height="14" fill="#227a3d"/>
  <text x="80" y="426" font-size="11" fill="#1a1a1a">Alimentación</text>

  <rect x="200" y="415" width="14" height="14" fill="#2c5aa0"/>
  <text x="220" y="426" font-size="11" fill="#1a1a1a">Bus I²C (Ruta A y B)</text>

  <rect x="400" y="415" width="14" height="14" fill="#8a6d00"/>
  <text x="420" y="426" font-size="11" fill="#1a1a1a">Interrupción INT (solo Ruta B, opcional)</text>

  <text x="380" y="460" text-anchor="middle" font-size="10" fill="#777777">
    Pin INT (GPIO13) confirmado contra el mapeo global de pines del proyecto (thesis/capitulo-2-materiales-y-metodos/capitulo-2.md, Tabla 2.3) — sin conflicto con GPIO4 (DATA del DHT22).
  </text>


  <!-- ===== Componentes pasivos (generado; ver README.md del sensor, tabla de pasivos) ===== -->
  <g id="componentes-pasivos" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="480" width="760" height="377" fill="#ffffff"/>
  <rect x="16" y="486" width="728" height="365" rx="6" fill="#fafafa" stroke="#cccccc"/>
  <text x="30" y="506" font-size="13" font-weight="bold" fill="#1a1a1a">Componentes pasivos</text>
  <line x1="190" y1="502" x2="212" y2="502" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="218" y="506" font-size="10.5" fill="#1a1a1a">externo a añadir</text>
  <line x1="340" y1="502" x2="362" y2="502" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
  <text x="368" y="506" font-size="10.5" fill="#1a1a1a">externo opcional</text>
  <line x1="490" y1="502" x2="512" y2="502" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="518" y="506" font-size="10.5" fill="#1a1a1a">ya en el módulo / placa</text>
  <text x="30" y="524" font-size="9.5" fill="#555555">Estado del valor: <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></text>
  <line x1="30" y1="543" x2="40" y2="543" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="536" x2="40" y2="550" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="536" x2="45" y2="550" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="543" x2="55" y2="543" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="542" font-size="11" font-weight="bold" fill="#1a1a1a">100 µF electrolítico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="556" font-size="9.5" fill="#444444">Entre 3V3 y GND de la ESP32, junto a la placa — valor de diseño, no tomado de hoja de datos</text>
  <line x1="30" y1="576" x2="40" y2="576" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="569" x2="40" y2="583" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="569" x2="45" y2="583" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="576" x2="55" y2="576" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="575" font-size="11" font-weight="bold" fill="#1a1a1a">100 nF cerámico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="589" font-size="9.5" fill="#444444">Entre 3V3 y GND de la ESP32, en paralelo con el de 100 µF — valor de diseño</text>
  <line x1="30" y1="609" x2="38" y2="609" stroke="#c0392b" stroke-width="2" fill="none"/><polygon points="38,603 38,615 47,609" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="47" y1="603" x2="47" y2="615" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="47" y1="609" x2="55" y2="609" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="608" font-size="11" font-weight="bold" fill="#1a1a1a">1N4007 en serie (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#c0392b">● pendiente de verificar</tspan></tspan></text>
  <text x="66" y="622" font-size="9.5" fill="#444444">Solo en la entrada externa de 6.5–16 V hacia VIN; NO en el riel de 5 V/USB. Caída ≈ 1.1 V a 1 A (hoja 1N4007). Tope del regulador de la</text>
  <text x="66" y="635" font-size="9.5" fill="#444444">placa no confirmado</text>
  <line x1="30" y1="655" x2="40" y2="655" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="40" y1="648" x2="40" y2="662" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="648" x2="45" y2="662" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="45" y1="655" x2="55" y2="655" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="66" y="654" font-size="11" font-weight="bold" fill="#1a1a1a">100 nF cerámico (×1)<tspan font-weight="normal" font-size="9.5">  <tspan fill="#227a3d">● hoja de datos</tspan>  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="668" font-size="9.5" fill="#444444">Entre VCC y GND, lo más cerca posible del pin VCC del módulo GY-6500 (hoja MPU-6500: 0.1 µF X7R en VDD)</text>
  <line x1="30" y1="688" x2="40" y2="688" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><line x1="40" y1="681" x2="40" y2="695" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><line x1="45" y1="681" x2="45" y2="695" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><line x1="45" y1="688" x2="55" y2="688" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="66" y="687" font-size="11" font-weight="bold" fill="#1a1a1a">0.1 µF VDD · 0.1 µF REGOUT · 10 nF VDDIO<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="701" font-size="9.5" fill="#444444">En el módulo, junto al chip (hoja PS-MPU-6500A-01, tabla de pines)</text>
  <circle cx="42" cy="721" r="7" stroke="#c0392b" stroke-width="2" fill="none"/><text x="42" y="725" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="720" font-size="11" font-weight="bold" fill="#1a1a1a">AD0 a 3.3 V → dirección 0x69<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="734" font-size="9.5" fill="#444444">El módulo trae pull-down en AD0 (0x68 por defecto); puentear AD0 a 3.3 V porque 0x68 es del DS3231</text>
  <circle cx="42" cy="754" r="7" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><text x="42" y="758" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="753" font-size="11" font-weight="bold" fill="#1a1a1a">Bus I²C: sin pull-ups extra<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="767" font-size="9.5" fill="#444444">Si los módulos ya los traen, no añadir. Añadir 4.7 kΩ o 5.1 kΩ (SDA y SCL a 3.3 V) solo si ningún módulo los trae o el analizador lógico</text>
  <text x="66" y="780" font-size="9.5" fill="#444444">muestra flancos lentos</text>
  <circle cx="42" cy="800" r="7" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/><text x="42" y="804" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">i</text>
  <text x="66" y="799" font-size="11" font-weight="bold" fill="#1a1a1a">DS3231: circuito de carga de la pila<tspan font-weight="normal" font-size="9.5">  <tspan fill="#b9770e">● verificar en el módulo recibido</tspan></tspan></text>
  <text x="66" y="813" font-size="9.5" fill="#444444">Módulos baratos (ZS-042) cargan la pila desde VCC (≈200 Ω + diodo): usar LIR2032, o con CR2032 retirar el diodo o la resistencia de</text>
  <text x="66" y="826" font-size="9.5" fill="#444444">carga (fuente: foros, no hoja de datos)</text>
  </g>
</svg>
