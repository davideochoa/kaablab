<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión ESP32 DevKit V1 — MPU6050/MPU6500</title>
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión ESP32 DevKit V1 ↔ MPU6050 / MPU6500
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — vibración estructural (banda objetivo 300–600 Hz)
  </text>

  <!-- ESP32 DevKit V1 box -->
  <rect x="60" y="100" width="200" height="300" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">ESP32 DevKit V1</text>

  <!-- ESP32 pins -->
  <circle cx="252" cy="170" r="4" fill="#2c5aa0"/>
  <text x="150" y="175" text-anchor="end" font-size="13" fill="#1a1a1a">3V3</text>

  <circle cx="252" cy="210" r="4" fill="#2c5aa0"/>
  <text x="150" y="215" text-anchor="end" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="252" cy="250" r="4" fill="#2c5aa0"/>
  <text x="150" y="255" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO21 (SDA)</text>

  <circle cx="252" cy="290" r="4" fill="#2c5aa0"/>
  <text x="150" y="295" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO22 (SCL)</text>

  <circle cx="252" cy="330" r="4" fill="#8a6d00"/>
  <text x="150" y="335" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO13 (INT)</text>
  <text x="150" y="350" text-anchor="end" font-size="10" fill="#8a6d00">Ruta B, opcional —</text>
  <text x="150" y="362" text-anchor="end" font-size="10" fill="#8a6d00">GPIO13 confirmado (Tabla 2.3)</text>

  <!-- MPU6050 box -->
  <rect x="500" y="140" width="200" height="220" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="600" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">MPU6050 / MPU6500</text>
  <text x="600" y="185" text-anchor="middle" font-size="11" fill="#555555">(módulo GY-521)</text>

  <circle cx="508" cy="210" r="4" fill="#227a3d"/>
  <text x="525" y="215" font-size="13" fill="#1a1a1a">VCC (3.3V)</text>

  <circle cx="508" cy="250" r="4" fill="#227a3d"/>
  <text x="525" y="255" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="508" cy="290" r="4" fill="#227a3d"/>
  <text x="525" y="295" font-size="13" fill="#1a1a1a">SDA</text>

  <circle cx="508" cy="330" r="4" fill="#227a3d"/>
  <text x="525" y="335" font-size="13" fill="#1a1a1a">SCL</text>

  <circle cx="700" cy="210" r="4" fill="#8a6d00"/>
  <text x="695" y="205" text-anchor="end" font-size="13" fill="#1a1a1a">INT</text>

  <!-- Connections -->
  <!-- VCC -->
  <line x1="252" y1="170" x2="508" y2="210" stroke="#227a3d" stroke-width="2"/>
  <text x="380" y="180" text-anchor="middle" font-size="11" fill="#227a3d">3V3 → VCC</text>

  <!-- GND -->
  <line x1="252" y1="210" x2="508" y2="250" stroke="#555555" stroke-width="2"/>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#555555">GND → GND</text>

  <!-- SDA -->
  <line x1="252" y1="250" x2="508" y2="290" stroke="#2c5aa0" stroke-width="2"/>
  <text x="380" y="264" text-anchor="middle" font-size="11" fill="#2c5aa0">GPIO21 → SDA</text>

  <!-- SCL -->
  <line x1="252" y1="290" x2="508" y2="330" stroke="#2c5aa0" stroke-width="2"/>
  <text x="380" y="304" text-anchor="middle" font-size="11" fill="#2c5aa0">GPIO22 → SCL</text>

  <!-- INT (optional, dashed) -->
  <line x1="252" y1="330" x2="700" y2="210" stroke="#8a6d00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="470" y="255" text-anchor="middle" font-size="11" fill="#8a6d00">GPIO13 → INT (Ruta B, opcional)</text>

  <!-- Legend -->
  <rect x="60" y="415" width="14" height="14" fill="#227a3d"/>
  <text x="80" y="426" font-size="11" fill="#1a1a1a">Alimentación</text>

  <rect x="200" y="415" width="14" height="14" fill="#2c5aa0"/>
  <text x="220" y="426" font-size="11" fill="#1a1a1a">Bus I²C (Ruta A y B)</text>

  <rect x="400" y="415" width="14" height="14" fill="#8a6d00"/>
  <text x="420" y="426" font-size="11" fill="#1a1a1a">Interrupción INT (solo Ruta B, opcional)</text>

  <text x="380" y="460" text-anchor="middle" font-size="10" fill="#777777">
    Pin INT (GPIO13) confirmado contra el mapeo global de pines del proyecto (thesis/capitulo-2-materiales-y-metodos/capitulo-2.md, Tabla 2.3) — sin conflicto con GPIO4 (DATA del DHT22).
  </text>
</svg>
