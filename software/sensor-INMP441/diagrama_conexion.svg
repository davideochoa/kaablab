<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema de conexión ESP32 DevKit V1 — INMP441</title>
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Conexión ESP32 DevKit V1 ↔ INMP441
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — audio I²S, nivel acústico / vitalidad de la colonia (16 kHz, mono)
  </text>

  <!-- ESP32 DevKit V1 box -->
  <rect x="60" y="90" width="200" height="320" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">ESP32 DevKit V1</text>

  <!-- ESP32 pins -->
  <circle cx="252" cy="160" r="4" fill="#2c5aa0"/>
  <text x="150" y="165" text-anchor="end" font-size="13" fill="#1a1a1a">3V3</text>

  <circle cx="252" cy="200" r="4" fill="#2c5aa0"/>
  <text x="150" y="205" text-anchor="end" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="252" cy="240" r="4" fill="#7a2ca0"/>
  <text x="150" y="245" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO14 (SCK)</text>

  <circle cx="252" cy="280" r="4" fill="#7a2ca0"/>
  <text x="150" y="285" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO15 (WS)</text>

  <circle cx="252" cy="320" r="4" fill="#7a2ca0"/>
  <text x="150" y="325" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO32 (SD)</text>

  <circle cx="252" cy="360" r="4" fill="#555555"/>
  <text x="150" y="365" text-anchor="end" font-size="13" fill="#1a1a1a">GND (2)</text>
  <text x="150" y="380" text-anchor="end" font-size="10" fill="#555555">para L/R -&gt; canal mono</text>

  <!-- INMP441 box -->
  <rect x="500" y="110" width="200" height="270" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">INMP441</text>
  <text x="600" y="155" text-anchor="middle" font-size="11" fill="#555555">micrófono MEMS I²S</text>

  <circle cx="508" cy="190" r="4" fill="#227a3d"/>
  <text x="525" y="195" font-size="13" fill="#1a1a1a">VDD (3.3V)</text>

  <circle cx="508" cy="225" r="4" fill="#227a3d"/>
  <text x="525" y="230" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="508" cy="260" r="4" fill="#7a2ca0"/>
  <text x="525" y="265" font-size="13" fill="#1a1a1a">SCK</text>

  <circle cx="508" cy="295" r="4" fill="#7a2ca0"/>
  <text x="525" y="300" font-size="13" fill="#1a1a1a">WS</text>

  <circle cx="508" cy="330" r="4" fill="#7a2ca0"/>
  <text x="525" y="335" font-size="13" fill="#1a1a1a">SD</text>

  <circle cx="508" cy="360" r="4" fill="#555555"/>
  <text x="525" y="365" font-size="13" fill="#1a1a1a">L/R</text>

  <!-- Connections -->
  <!-- VDD -->
  <line x1="252" y1="160" x2="508" y2="190" stroke="#227a3d" stroke-width="2"/>
  <text x="380" y="168" text-anchor="middle" font-size="11" fill="#227a3d">3V3 → VDD</text>

  <!-- GND -->
  <line x1="252" y1="200" x2="508" y2="225" stroke="#555555" stroke-width="2"/>
  <text x="380" y="205" text-anchor="middle" font-size="11" fill="#555555">GND → GND</text>

  <!-- SCK -->
  <line x1="252" y1="240" x2="508" y2="260" stroke="#7a2ca0" stroke-width="2"/>
  <text x="380" y="243" text-anchor="middle" font-size="11" fill="#7a2ca0">GPIO14 → SCK</text>

  <!-- WS -->
  <line x1="252" y1="280" x2="508" y2="295" stroke="#7a2ca0" stroke-width="2"/>
  <text x="380" y="281" text-anchor="middle" font-size="11" fill="#7a2ca0">GPIO15 → WS</text>

  <!-- SD -->
  <line x1="252" y1="320" x2="508" y2="330" stroke="#7a2ca0" stroke-width="2"/>
  <text x="380" y="319" text-anchor="middle" font-size="11" fill="#7a2ca0">GPIO32 → SD</text>

  <!-- L/R to GND -->
  <line x1="252" y1="360" x2="508" y2="360" stroke="#555555" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="380" y="352" text-anchor="middle" font-size="11" fill="#555555">GND → L/R (canal izquierdo, mono)</text>

  <!-- Legend -->
  <rect x="60" y="425" width="14" height="14" fill="#227a3d"/>
  <text x="80" y="436" font-size="11" fill="#1a1a1a">Alimentación</text>

  <rect x="200" y="425" width="14" height="14" fill="#7a2ca0"/>
  <text x="220" y="436" font-size="11" fill="#1a1a1a">Bus I²S (SCK/WS/SD)</text>

  <rect x="430" y="425" width="14" height="14" fill="#555555"/>
  <text x="450" y="436" font-size="11" fill="#1a1a1a">GND / selección de canal (L/R)</text>

  <text x="380" y="460" text-anchor="middle" font-size="10" fill="#777777">
    L/R a GND selecciona el canal izquierdo del INMP441 (mono) — suficiente para una señal de audio por colmena.
  </text>
</svg>
