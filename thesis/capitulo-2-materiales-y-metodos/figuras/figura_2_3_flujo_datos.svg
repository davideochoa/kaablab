<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1370" width="1100" height="1370" font-family="Segoe UI, Arial, sans-serif">
  <title>Figura 2.3 — Flujo del dato desde la captura hasta el dataset</title>
  <rect x="0" y="0" width="1100" height="1370" fill="#ffffff"/>

  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">
    Flujo del dato desde la captura hasta el dataset
  </text>
  <text x="550" y="56" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — sección 2.3.3, operación local en campo: sin servidor ni nube
  </text>

  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2c5aa0"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8a6d00"/>
    </marker>
  </defs>

  <!-- 1. Sensores -->
  <rect x="30" y="80" width="1040" height="140" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="550" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Sensores</text>

  <rect x="50" y="124" width="188" height="78" rx="6" fill="#ffffff" stroke="#227a3d" stroke-width="1.5"/>
  <text x="144" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Temp/HR interna</text>
  <text x="144" y="172" text-anchor="middle" font-size="10" fill="#555555">SHT31</text>

  <rect x="252" y="124" width="188" height="78" rx="6" fill="#ffffff" stroke="#227a3d" stroke-width="1.5"/>
  <text x="346" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Temp/HR externa</text>
  <text x="346" y="172" text-anchor="middle" font-size="10" fill="#555555">DHT22</text>

  <rect x="454" y="124" width="188" height="78" rx="6" fill="#f2e9f7" stroke="#7a2ca0" stroke-width="1.5"/>
  <text x="548" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Audio aéreo</text>
  <text x="548" y="172" text-anchor="middle" font-size="10" fill="#555555">INMP441</text>

  <rect x="656" y="124" width="188" height="78" rx="6" fill="#fdf0e4" stroke="#e08a3c" stroke-width="1.5"/>
  <text x="750" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Vibración estructural</text>
  <text x="750" y="172" text-anchor="middle" font-size="10" fill="#555555">MPU6500 (3 ejes)</text>

  <rect x="858" y="124" width="188" height="78" rx="6" fill="#fffdf5" stroke="#7a5a30" stroke-width="1.5"/>
  <text x="952" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Conteo IR</text>
  <text x="952" y="172" text-anchor="middle" font-size="10" fill="#555555">doble haz en piquera</text>

  <line x1="550" y1="220" x2="550" y2="266" stroke="#2c5aa0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- 2. ESP32 -->
  <rect x="190" y="270" width="620" height="170" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="500" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">ESP32 — nodo de borde</text>
  <text x="500" y="326" text-anchor="middle" font-size="11" fill="#555555">Solo lectura cruda: no calcula características ni fusión</text>
  <text x="500" y="346" text-anchor="middle" font-size="11" fill="#555555">Ciclo: 5 min activo / 55 min en deep sleep</text>
  <text x="500" y="372" text-anchor="middle" font-size="10.5" fill="#1a1a1a">10 ventanas por ciclo, una cada 30 s:</text>
  <text x="500" y="390" text-anchor="middle" font-size="10" fill="#555555">audio 1 s a 16 kHz · vibración 2 s a 1500 Hz (3 ejes)</text>
  <text x="500" y="406" text-anchor="middle" font-size="10" fill="#555555">temperatura/humedad interna y externa · conteo IR</text>

  <!-- RTC -->
  <rect x="860" y="300" width="210" height="110" rx="6" fill="#fff8e6" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="965" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d00">Reloj RTC DS3231</text>
  <text x="965" y="348" text-anchor="middle" font-size="10" fill="#1a1a1a">bus I²C, dirección 0x68</text>
  <text x="965" y="366" text-anchor="middle" font-size="10" fill="#1a1a1a">marca de tiempo</text>
  <text x="965" y="382" text-anchor="middle" font-size="10" fill="#1a1a1a">de cada ventana</text>
  <line x1="860" y1="355" x2="814" y2="355" stroke="#8a6d00" stroke-width="2" marker-end="url(#arrowGold)"/>

  <line x1="500" y1="440" x2="500" y2="486" stroke="#2c5aa0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- 3. microSD -->
  <rect x="190" y="490" width="620" height="110" rx="8" fill="#fffdf5" stroke="#7a5a30" stroke-width="2"/>
  <text x="500" y="526" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Almacenamiento en microSD</text>
  <text x="500" y="548" text-anchor="middle" font-size="10.5" fill="#555555">Una entrada por ventana: audio y vibración en binario,</text>
  <text x="500" y="564" text-anchor="middle" font-size="10.5" fill="#555555">metadatos en JSON con marca de tiempo</text>

  <line x1="500" y1="600" x2="500" y2="646" stroke="#2c5aa0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- 4. Red WiFi local -->
  <rect x="190" y="650" width="620" height="110" rx="8" fill="#f2e9f7" stroke="#7a2ca0" stroke-width="2"/>
  <text x="500" y="686" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Red WiFi local del ESP32</text>
  <text x="500" y="708" text-anchor="middle" font-size="10.5" fill="#555555">Access Point abierto, sin internet</text>
  <text x="500" y="724" text-anchor="middle" font-size="10.5" fill="#555555">descarga de los ciclos por HTTP local</text>

  <line x1="500" y1="760" x2="500" y2="806" stroke="#2c5aa0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- 5. App Android -->
  <rect x="30" y="810" width="1040" height="220" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="550" y="842" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">App Android (en campo, sin internet)</text>

  <rect x="50" y="862" width="188" height="130" rx="6" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="144" y="890" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Procesamiento</text>
  <text x="144" y="912" text-anchor="middle" font-size="10" fill="#555555">pre-énfasis, MFCC</text>
  <text x="144" y="928" text-anchor="middle" font-size="10" fill="#555555">fusión ponderada de</text>
  <text x="144" y="944" text-anchor="middle" font-size="10" fill="#555555">temperatura/humedad</text>
  <text x="144" y="960" text-anchor="middle" font-size="10" fill="#555555">descriptores de</text>
  <text x="144" y="976" text-anchor="middle" font-size="10" fill="#555555">vibración y tráfico</text>

  <rect x="252" y="862" width="188" height="130" rx="6" fill="#ffffff" stroke="#227a3d" stroke-width="1.5"/>
  <text x="346" y="890" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Inferencia</text>
  <text x="346" y="912" text-anchor="middle" font-size="10" fill="#555555">modelo XGBoost</text>
  <text x="346" y="928" text-anchor="middle" font-size="10" fill="#555555">exportado</text>

  <rect x="454" y="862" width="188" height="130" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="548" y="890" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Gráficas y alertas</text>
  <text x="548" y="912" text-anchor="middle" font-size="10" fill="#555555">estado de la colmena</text>

  <rect x="656" y="862" width="188" height="130" rx="6" fill="#ffffff" stroke="#e08a3c" stroke-width="1.5"/>
  <text x="750" y="890" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Etiquetado</text>
  <text x="750" y="912" text-anchor="middle" font-size="10" fill="#555555">observación directa</text>
  <text x="750" y="928" text-anchor="middle" font-size="10" fill="#555555">del meliponicultor</text>

  <rect x="858" y="862" width="188" height="130" rx="6" fill="#ffffff" stroke="#7a5a30" stroke-width="1.5"/>
  <text x="952" y="890" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Histórico local</text>
  <text x="952" y="912" text-anchor="middle" font-size="10" fill="#555555">registros, resultados</text>
  <text x="952" y="928" text-anchor="middle" font-size="10" fill="#555555">y etiquetas en el</text>
  <text x="952" y="944" text-anchor="middle" font-size="10" fill="#555555">dispositivo</text>

  <text x="550" y="1016" text-anchor="middle" font-size="10" fill="#555555">mismos pasos del pipeline de la sección 2.7, ejecutados en el teléfono</text>

  <line x1="550" y1="1030" x2="550" y2="1096" stroke="#8a6d00" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGold)"/>
  <text x="565" y="1068" font-size="10" fill="#8a6d00">posterior, cuando hay conexión</text>

  <!-- 6. Zenodo -->
  <rect x="250" y="1100" width="600" height="100" rx="8" fill="#fff8e6" stroke="#8a6d00" stroke-width="2"/>
  <text x="550" y="1136" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Exportación manual del dataset a Zenodo</text>
  <text x="550" y="1158" text-anchor="middle" font-size="10.5" fill="#555555">publicación del dataset etiquetado, fuera de la operación en campo</text>

  <!-- Leyenda -->
  <line x1="200" y1="1252" x2="240" y2="1252" stroke="#2c5aa0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <text x="250" y="1256" font-size="10.5" fill="#1a1a1a">Flujo local en campo (sin internet)</text>
  <line x1="620" y1="1252" x2="660" y2="1252" stroke="#8a6d00" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGold)"/>
  <text x="670" y="1256" font-size="10.5" fill="#1a1a1a">Paso manual posterior, con conexión</text>

  <!-- Footer -->
  <text x="550" y="1310" text-anchor="middle" font-size="10" fill="#777777">
    El ESP32 no procesa la señal: el procesamiento, la inferencia y el etiquetado se hacen en la app Android.
  </text>
  <text x="550" y="1325" text-anchor="middle" font-size="10" fill="#777777">
    Sin servidor ni nube en la operación de campo.
  </text>
</svg>
