<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1480" width="1100" height="1480" font-family="Segoe UI, Arial, sans-serif">
  <title>Figura 2.3 — Flujo del dato desde la captura hasta el dataset</title>
  <rect x="0" y="0" width="1100" height="1480" fill="#ffffff"/>

  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">
    Flujo del dato desde la captura hasta el dataset
  </text>
  <text x="550" y="56" text-anchor="middle" font-size="12" fill="#555555">
    KaabLab — sección 2.3.3, inalámbrico con respaldo local
  </text>

  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2c5aa0"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8a6d00"/>
    </marker>
  </defs>

  <!-- 1. ESP32 -->
  <rect x="250" y="90" width="600" height="140" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="550" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">ESP32 — nodo de borde</text>
  <text x="550" y="152" text-anchor="middle" font-size="11" fill="#555555">Muestreo periódico: 5 min activo / 55 min dormido</text>
  <text x="550" y="169" text-anchor="middle" font-size="11" fill="#555555">(preserva autonomía energética)</text>
  <text x="550" y="205" text-anchor="middle" font-size="10" fill="#777777">captura de las 4 modalidades: audio, vibración, ambientales, conteo IR</text>

  <line x1="550" y1="230" x2="550" y2="286" stroke="#2c5aa0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- 2. Buffer local microSD -->
  <rect x="250" y="290" width="600" height="120" rx="8" fill="#fffdf5" stroke="#7a5a30" stroke-width="2"/>
  <text x="550" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Buffer local en microSD</text>
  <text x="550" y="348" text-anchor="middle" font-size="10.5" fill="#555555">Cada ciclo de muestreo escribe las lecturas localmente</text>
  <text x="550" y="364" text-anchor="middle" font-size="10.5" fill="#555555">antes de intentar la transmisión</text>

  <!-- Backup / retry loop -->
  <path d="M850,335 L960,335 L960,400 L852,400" fill="none" stroke="#8a6d00" stroke-width="2" marker-end="url(#arrowGold)"/>
  <rect x="855" y="290" width="215" height="118" rx="6" fill="#fff8e6" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="962" y="308" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6d00">Sin enlace disponible</text>
  <text x="962" y="323" text-anchor="middle" font-size="9" fill="#1a1a1a">El dato espera en la</text>
  <text x="962" y="336" text-anchor="middle" font-size="9" fill="#1a1a1a">microSD y se sincroniza</text>
  <text x="962" y="349" text-anchor="middle" font-size="9" fill="#1a1a1a">de forma diferida cuando</text>
  <text x="962" y="362" text-anchor="middle" font-size="9" fill="#1a1a1a">vuelve a haber cobertura</text>

  <!-- Split to WiFi / LoRa -->
  <line x1="500" y1="410" x2="305" y2="466" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="600" y1="410" x2="795" y2="466" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 3a. WiFi -->
  <rect x="140" y="470" width="330" height="140" rx="8" fill="#f2e9f7" stroke="#7a2ca0" stroke-width="2"/>
  <text x="305" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Transmisión WiFi</text>
  <text x="305" y="524" text-anchor="middle" font-size="10" fill="#555555">Audio — requiere el ancho de</text>
  <text x="305" y="538" text-anchor="middle" font-size="10" fill="#555555">banda suficiente que solo</text>
  <text x="305" y="552" text-anchor="middle" font-size="10" fill="#555555">WiFi ofrece</text>
  <text x="305" y="580" text-anchor="middle" font-size="9" fill="#7a2ca0">meliponario con cobertura WiFi</text>

  <!-- 3b. LoRa -->
  <rect x="630" y="470" width="330" height="140" rx="8" fill="#fdf0e4" stroke="#e08a3c" stroke-width="2"/>
  <text x="795" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Transmisión LoRa</text>
  <text x="795" y="524" text-anchor="middle" font-size="10" fill="#555555">Variables ambientales y conteo IR —</text>
  <text x="795" y="538" text-anchor="middle" font-size="10" fill="#555555">telemetría ligera</text>
  <text x="795" y="558" text-anchor="middle" font-size="9" fill="#e08a3c">sitios remotos sin cobertura WiFi</text>

  <!-- Merge to Servidor -->
  <line x1="305" y1="610" x2="500" y2="658" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="795" y1="610" x2="600" y2="658" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 4. Servidor -->
  <rect x="250" y="660" width="600" height="110" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="550" y="700" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Servidor</text>
  <text x="550" y="722" text-anchor="middle" font-size="10.5" fill="#555555">Recepción y consolidación de los datos transmitidos</text>

  <line x1="550" y1="770" x2="550" y2="816" stroke="#2c5aa0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- 5. Etiquetado -->
  <rect x="250" y="820" width="600" height="130" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="550" y="858" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Etiquetado por el meliponicultor</text>
  <text x="550" y="878" text-anchor="middle" font-size="10.5" fill="#555555">Observación directa del estado de la colmena</text>
  <text x="550" y="895" text-anchor="middle" font-size="9.5" fill="#777777">sujeto a disponibilidad y a la dificultad de observar ciertos estados</text>

  <line x1="550" y1="950" x2="550" y2="996" stroke="#2c5aa0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- 6. Dataset consolidado -->
  <rect x="250" y="1000" width="600" height="160" rx="8" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="550" y="1035" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Dataset consolidado</text>
  <text x="550" y="1057" text-anchor="middle" font-size="10.5" fill="#555555">Audio y vibración → formato Parquet</text>
  <text x="550" y="1074" text-anchor="middle" font-size="10.5" fill="#555555">Conteo IR y variables ambientales → series de tiempo estructuradas</text>
  <text x="550" y="1096" text-anchor="middle" font-size="9.5" fill="#777777">Partición 70/15/15 con estratificación por clase</text>
  <text x="550" y="1112" text-anchor="middle" font-size="9.5" fill="#777777">Manejo de desbalance: pérdida ponderada, augmentation, SMOTE si &gt;1:10</text>
  <text x="550" y="1128" text-anchor="middle" font-size="9.5" fill="#777777">Etiquetado indirecto del conteo IR por correlación con observación directa</text>

  <line x1="550" y1="1160" x2="550" y2="1206" stroke="#2c5aa0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- 7. Zenodo -->
  <rect x="250" y="1210" width="600" height="110" rx="8" fill="#eefbf1" stroke="#227a3d" stroke-width="2"/>
  <text x="550" y="1250" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Publicación en Zenodo</text>
  <text x="550" y="1272" text-anchor="middle" font-size="10.5" fill="#555555">Licencia CC BY 4.0 — dataset abierto al concluir</text>

  <!-- Legend -->
  <rect x="80" y="1360" width="14" height="14" fill="#f2e9f7" stroke="#7a2ca0" stroke-width="2"/>
  <text x="100" y="1371" font-size="10.5" fill="#1a1a1a">Ruta WiFi (audio)</text>

  <rect x="320" y="1360" width="14" height="14" fill="#fdf0e4" stroke="#e08a3c" stroke-width="2"/>
  <text x="340" y="1371" font-size="10.5" fill="#1a1a1a">Ruta LoRa (ambientales + IR, sitios remotos)</text>

  <rect x="700" y="1360" width="14" height="14" fill="#fff8e6" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="720" y="1371" font-size="10.5" fill="#1a1a1a">Respaldo local si no hay enlace</text>

  <!-- Footer -->
  <text x="550" y="1410" text-anchor="middle" font-size="10" fill="#777777">
    Diseño inalámbrico con respaldo local: si no hay enlace disponible, el dato espera en la microSD y se sincroniza de
  </text>
  <text x="550" y="1425" text-anchor="middle" font-size="10" fill="#777777">
    forma diferida cuando vuelve a haber cobertura, en lugar de perderse.
  </text>
</svg>
